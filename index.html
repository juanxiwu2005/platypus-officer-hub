<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Platypus Officer Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Platypus v0.1 front-end prototype for the ERP honors thesis (Phase 3). Fictional organization, example data.">
<style>
/* Layout: app shell — left nav (Budget, Handoff, Tasks, AI), center dashboard, right quick links, officer directory at the bottom (matches the Phase 2 survey description). Tokens follow the Platypus design-book website. */
:root {
  --bg: #fbfaf7;
  --surface: #ffffff;
  --surface-2: #f3f1ec;
  --ink: #1b1f1d;
  --muted: #5b625e;
  --line: #e5e2da;
  --accent: #0f766e;
  --accent-ink: #0b5a54;
  --accent-soft: #e4f1ef;
  --on-accent: #ffffff;
  --warn: #8f5206;
  --warn-soft: #fbf0dc;
  --late: #b42318;
  --late-soft: #fbe7e5;
  --done: #5b625e;
  --shadow: 0 1px 2px rgba(20, 24, 22, .05), 0 8px 24px rgba(20, 24, 22, .06);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #171c1b; --surface-2: #1d2322; --ink: #eceeed; --muted: #a2aaa6; --line: #2a312f;
    --accent: #3fb8a8; --accent-ink: #7fd6ca; --accent-soft: #14302c; --on-accent: #06201d;
    --warn: #e7a74a; --warn-soft: #33270f; --late: #f08a80; --late-soft: #3a1c19; --done: #a2aaa6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #171c1b; --surface-2: #1d2322; --ink: #eceeed; --muted: #a2aaa6; --line: #2a312f;
  --accent: #3fb8a8; --accent-ink: #7fd6ca; --accent-soft: #14302c; --on-accent: #06201d;
  --warn: #e7a74a; --warn-soft: #33270f; --late: #f08a80; --late-soft: #3a1c19; --done: #a2aaa6;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent-ink); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 3.2vw, 34px); }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { font-family: var(--serif); font-size: 19px; font-weight: 650; }
.brand span { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.top-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-inline { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; max-width: 100%; }
.field-inline select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0; max-width: 100%; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }
.demo-strip { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; }
.demo-strip .topbar-in { padding-block: 6px; gap: 8px; }

/* Shell */
.shell { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; display: grid; grid-template-columns: 210px minmax(0, 1fr) 270px; gap: 24px; align-items: start; }
.sidenav { position: sticky; top: 92px; display: grid; gap: 2px; }
.sidenav .group { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.sidenav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 14.5px; }
.sidenav a svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.sidenav a:hover { background: var(--surface-2); }
.sidenav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.sidenav a[aria-current="page"] svg { color: var(--accent-ink); }
.sidenav .count { margin-left: auto; font-size: 12px; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main > * { min-width: 0; }
#cardPick { width: 100%; max-width: 420px; text-overflow: ellipsis; }
main:focus { outline: none; }
.rail { position: sticky; top: 92px; display: grid; gap: 16px; min-width: 0; }

/* Cards and blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card > header p { font-size: 13px; color: var(--muted); }
.page-head { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 16px; max-width: 62ch; }
.lede b { color: var(--ink); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.grid-2 > * { min-width: 0; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--accent-ink); padding-inline: 6px; }
.btn-quiet:hover { background: var(--accent-soft); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Pills and tags */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-todo { background: var(--surface-2); color: var(--muted); }
.st-progress { background: var(--accent-soft); color: var(--accent-ink); }
.st-waiting { background: var(--warn-soft); color: var(--warn); }
.st-stuck, .st-late { background: var(--late-soft); color: var(--late); }
.st-done { background: transparent; color: var(--done); border-color: var(--line); }
.st-done::before { content: "✓"; width: auto; height: auto; background: none; font-size: 11px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px/1.5 var(--mono); padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); text-decoration: none; white-space: nowrap; }
a.tag:hover { border-color: var(--accent); color: var(--accent-ink); }
.tag-ai { border-style: dashed; border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.tag-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.tag-late { border-color: var(--late); color: var(--late); background: var(--late-soft); }

/* Behind the scenes annotations */
.bts { display: none; align-items: center; gap: 5px; font: 600 11px/1.45 var(--mono); padding: 2px 7px; border-radius: 6px; border: 1px dashed var(--muted); color: var(--muted); background: var(--surface-2); white-space: normal; }
.bts b { color: var(--ink); font-weight: 700; }
.bts.k-ai { border-color: var(--accent); color: var(--accent-ink); }
.bts.k-ai b { color: var(--accent-ink); }
.bts.k-rule b { color: var(--ink); }
.show-bts .bts { display: inline-flex; }
.show-bts .bts-block { display: flex; }
.bts-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* Attention strip */
.attn { display: flex; gap: 10px; flex-wrap: wrap; }
.attn a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.attn a .n { font-family: var(--serif); font-size: 18px; }
.attn a.late { background: var(--late-soft); border-color: transparent; color: var(--late); }
.attn a.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.attn a.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Task list */
.tlist { list-style: none; margin: 0; padding: 0; display: grid; }
.tlist li { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.tlist li:first-child { border-top: 0; padding-top: 2px; }
.dblock { text-align: center; border-radius: 10px; background: var(--surface-2); padding: 5px 4px; line-height: 1.1; }
.dblock b { display: block; font-family: var(--serif); font-size: 20px; }
.dblock span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dblock.late { background: var(--late-soft); color: var(--late); }
.dblock.late span { color: var(--late); }
.tl-title { font-weight: 600; }
.tl-meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.who { display: inline-flex; align-items: center; gap: 6px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 10.5px/1 var(--sans); background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.avatar.lg { width: 34px; height: 34px; font-size: 13px; }
.avatar.none { background: var(--late-soft); color: var(--late); border: 1px dashed var(--late); }

/* Workload */
.wl { display: grid; gap: 12px; }
.wl-row { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; }
.wl-name { display: flex; gap: 10px; align-items: center; min-width: 0; }
.wl-name b { display: block; font-size: 14px; }
.wl-name span { display: block; font-size: 12px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar i.hot { background: var(--warn); }
.wl-h { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.note.late { background: var(--late-soft); color: var(--ink); }
.note.ai { background: var(--accent-soft); }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }

/* Chain */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.node { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.node.done { color: var(--done); text-decoration: line-through; text-decoration-color: var(--line); }
.node.waiting { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }
.node.late, .node.unowned { background: var(--late-soft); border-color: transparent; color: var(--late); font-weight: 600; }
.node.progress { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.arrow { color: var(--muted); font-size: 12px; }

/* Budget */
.big { font-family: var(--serif); font-size: 34px; line-height: 1.05; }
.meter { height: 12px; border-radius: 999px; background: var(--surface-2); display: flex; overflow: hidden; }
.meter i { display: block; height: 100%; }
.meter .m1 { background: var(--muted); }
.meter .m2 { background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.flash td { background: var(--accent-soft); }
.tbl select { padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; max-width: 170px; }
.tbl tr.unowned td { background: var(--late-soft); }

/* Filters */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Plan builder */
.composer { display: grid; gap: 10px; }
.composer textarea { width: 100%; min-height: 76px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); resize: vertical; font-size: 15px; line-height: 1.5; }
.brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.brief label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.brief input, .brief select { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); min-width: 0; }
.brief .chk { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 400; padding-top: 18px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) 190px; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.step.off { opacity: .5; }
.step.is-ai { border-style: dashed; border-color: var(--accent); }
.step.is-late { border-color: var(--late); }
.step input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.step h3 { font-family: var(--sans); font-size: 15px; font-weight: 650; letter-spacing: 0; }
.step .why { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.step .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.step .dates { display: grid; gap: 4px; font-size: 13px; align-content: start; }
.step .dates div { display: flex; justify-content: space-between; gap: 8px; }
.step .dates span { color: var(--muted); }
.step .dates b { font-variant-numeric: tabular-nums; }
.step select { padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; max-width: 100%; }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--serif); font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }
.loading { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; padding: 14px 0; }
.dots i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 4px; animation: blink 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* Outbox */
.mail { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.mail .subj { font-weight: 650; }
.mail pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; max-height: 0; overflow: hidden; padding-block: 0; transition: none; }
.mail.open pre { max-height: none; padding-block: 10px; }
.mail.sent { opacity: .65; }

/* Action card */
.acard { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.acard-head { padding: 16px 18px; background: var(--accent-soft); display: grid; gap: 6px; }
.acard-head .urg { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.acard-head h2 { font-size: 21px; }
.acard-body { padding: 16px 18px; display: grid; gap: 14px; }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.kv > span { font: 700 11.5px/1.8 var(--mono); letter-spacing: .06em; color: var(--muted); }
.kv ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.ready { display: grid; gap: 8px; }
.ready-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 13.5px; }
.ready-item .t { flex: 1; min-width: 0; }
.status-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.status-btns .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.acard-foot { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.compare { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.brief-msg { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; background: var(--surface); display: grid; gap: 8px; }
.brief-msg .from { font-size: 12.5px; color: var(--muted); }
.mylink { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
.mylink .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; background: var(--surface); }
.mylink .box.me { border-color: var(--accent); background: var(--accent-soft); }
.mylink .box b { display: block; font-size: 13.5px; }
.mylink .ar { align-self: center; color: var(--muted); }
.onetap { display: flex; gap: 6px; flex-wrap: wrap; }

/* Chat */
.chat { display: grid; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }
.bubble { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); max-width: 72ch; min-width: 0; display: grid; gap: 8px; }

.ask-bar { display: flex; gap: 8px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }

.contact { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.contact:first-child { border-top: 0; }

/* Histogram */
.hist { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; height: 150px; padding-top: 6px; }
.hist .col { display: grid; gap: 6px; align-items: end; height: 100%; grid-template-rows: 1fr auto; }
.hist .b { background: var(--accent); border-radius: 6px 6px 2px 2px; position: relative; min-height: 2px; }
.hist .b.over { background: var(--line); }
.hist .b em { position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist .lab { text-align: center; font-size: 12px; color: var(--muted); }

/* Architecture */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.flow .lane { display: grid; gap: 8px; align-content: start; }
.flow .lane > span { font: 700 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.flow .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); font-size: 13px; }
.flow .box b { display: block; font-size: 14px; }
.flow .box.ai { border-style: dashed; border-color: var(--accent); background: var(--accent-soft); }
.flow .box.rule { border-color: var(--ink); }
.flow .box.mock { background: var(--surface-2); }
code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }

/* Officers footer */
.officers { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
.officers-in { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.off-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.off { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.off .t { min-width: 0; flex: 1; }
.off b { display: block; font-size: 14px; }
.off .em { font: 12px/1.4 var(--mono); color: var(--muted); user-select: all; overflow-wrap: anywhere; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--muted); }
.iconbtn:hover { color: var(--accent-ink); border-color: var(--accent); }
.iconbtn svg { width: 15px; height: 15px; }

/* Rail */
.links { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.links a, .links .ph { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.links a:hover { background: var(--surface-2); }
.links svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.links .ph { color: var(--muted); }
.links small { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 1180px) {

<script>
"use strict";
/* =====================================================================
   PLATYPUS FRONT-END PROTOTYPE v0.1  ·  ERP honors thesis, Phase 3
   ---------------------------------------------------------------------
   What is real here:   the rule engine (backward scheduling, business
                        days, buffers), Gmail compose links, Google
                        Calendar links, rule-book sources.
   What is simulated:   every AI response, the data store (in memory),
                        reply classification.
   Backend plan (Option C): this page becomes a static site on Netlify.
   Each function in `api` below maps 1:1 to a Netlify Function at /api/*.
   The AI key lives only in Netlify environment variables, never here.
     POST /api/plan/draft       -> AIR chat, JSON schema   (steps + owners)
     POST /api/plan/approve     -> store tasks, draft cards
     POST /api/cards/draft      -> AIR chat               (card wording)
     POST /api/ask              -> AIR Verdicts (scope) + chat w/ rule book
     POST /api/replies/classify -> AIR Verdicts           (done/help/waiting)
     POST /api/reports          -> store one-tap durations, recompute P80
     GET  /api/rules            -> rule book (Google Sheet published as CSV)
     GET  /api/handbook/:role   -> built from task history (+ AIR summary)
     POST /api/flags            -> "this looks outdated" -> president review
   Dates are ALWAYS computed by the rule engine (schedule()), never by AI.
   ===================================================================== */

const CONFIG = {
  mode: "mock",                 // "mock" now; "live" once /api/* exists
  apiBase: "/api",
  aiBaseUrl: "https://openai.rc.asu.edu/v1",   // ASU AIR (server-side only)
  aiModel: "to be chosen after the Oct 23 RTO consult",
  tz: "America/Phoenix",
  siteUrl: "https://platypus-officer-hub.netlify.app"
};

/* ---------------- Utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000;
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const diffDays = (a, b) => Math.round((sod(a) - sod(b)) / DAY);
const fmtD = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtS = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtDay = d => d.toLocaleDateString("en-US", { weekday: "short" });
const fmtTime = hm => { const [h, m] = hm.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`; };
const minD = (...ds) => ds.filter(Boolean).reduce((a, b) => (a < b ? a : b));
const maxD = (...ds) => ds.filter(Boolean).reduce((a, b) => (a > b ? a : b));
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const hrs = m => (Math.round(m / 6) / 10).toFixed(1).replace(/\.0$/, "") + " h";
const initials = name => name.split(" ").map(s => s[0]).join("").slice(0, 2);
const TODAY = sod(new Date());

// ASU-observed holidays used for business-day math (demo list; verify each term)
const HOLIDAYS = new Set(["2026-11-11", "2026-11-26", "2026-11-27", "2026-12-24", "2026-12-25", "2026-12-31", "2027-01-01", "2027-01-18", "2027-03-09", "2027-03-10", "2027-03-11", "2027-03-12"]);
const BREAK = { from: "2026-12-19", to: "2027-01-10" }; // approximate winter break
const isBiz = d => { const w = d.getDay(); return w !== 0 && w !== 6 && !HOLIDAYS.has(ymd(d)); };
function addBiz(d, n) { let x = sod(d); const s = n < 0 ? -1 : 1; let k = Math.abs(n); while (k > 0) { x = addDays(x, s); if (isBiz(x)) k--; } return x; }
function prevBiz(d) { let x = sod(d); while (!isBiz(x)) x = addDays(x, -1); return x; }
const inBreak = d => { const s = ymd(d); return s >= BREAK.from && s <= BREAK.to; };
function nextWeekday(from, wd) { let x = sod(from); while (x.getDay() !== wd) x = addDays(x, 1); return x; }

/* ---------------- Rule book (official layer) ----------------
   Source: Prototype plan v0, "ASU 规则库 v0", pages opened Oct 7, 2026.
   Later: GET /api/rules reads these rows from a published Google Sheet. */
const SRC = {
  reg: { label: "Event Registry guidelines", url: "https://eventreg.asu.edu/about-registry/event-guidelines" },
  hb: { label: "Student Organization Handbook 2025–26", url: "https://eoss.asu.edu/sites/default/files/2025-04/ASU%20Student%20Organization%20-%2025_26%20Handbook.pdf" },
  space: { label: "Submit a Space Request", url: "https://eoss.asu.edu/student-unions/submit-a-space-request" },
  faq: { label: "Catering and Food FAQ (2023, recheck)", url: "https://eoss.asu.edu/sites/default/files/2023-09/FAQ%20-%20Catering%20and%20Food%20Guidelines%202.pdf" },
  usg: { label: "USG Spending Guidelines", url: "https://www.asuusgt.org/spending-guidelines" },
  usgr: { label: "USG Funding Rules", url: "https://www.asuusgt.org/funding-rules" }
};
const RULES = [
  { id: "R01", text: "On-campus, in-person events must be registered in Event Registry.", limit: "At least 14 days (Event Registry page); 30 days (Handbook)", src: ["reg", "hb"], flag: "Two sources disagree. Platypus uses the stricter 30 days.", kw: ["register", "registry", "registration", "ritm"] },
  { id: "R02", text: "Student-organization events need the advisor present. Public events or events over 250 people need a university representative present throughout.", limit: "—", src: ["reg"], kw: ["advisor", "adviser", "250", "representative"] },
  { id: "R03", text: "Student union spaces are booked in Mazevo, and only the top three officers can submit.", limit: "At least 16 days; outdoor tabling 3 business days; complex setups 2 weeks", src: ["space"], kw: ["room", "space", "mazevo", "book", "reserve", "venue", "tabling"] },
  { id: "R04", text: "The space request must include the event's RITM number from Event Registry.", limit: "At least 14 days before, or the booking may be canceled with a fee", src: ["space"], kw: ["ritm", "room", "space"] },
  { id: "R05", text: "Memorial Union, Student Pavilion and similar venues use Aramark / Sun Devil Dining exclusively for food.", limit: "Arrange at least 2 weeks ahead", src: ["hb"], kw: ["memorial union", "mu", "pavilion", "aramark", "sun devil dining", "pizza", "catering", "food", "restaurant"] },
  { id: "R06", text: "Outside caterers need a Food Exception Request plus the vendor's certificate of insurance.", limit: "14 days before", src: ["hb"], kw: ["outside", "off-campus", "restaurant", "caterer", "catering", "pizza", "exception", "insurance", "food"] },
  { id: "R07", text: "Food prepared on site needs a temporary food permit ($85).", limit: "At least 7 business days", src: ["faq"], flag: "Source is a 2023 FAQ. Recheck before relying on it.", kw: ["cook", "grill", "bbq", "prepare", "permit", "on site", "on-site"] },
  { id: "R08", text: "Homemade food may not be served.", limit: "—", src: ["hb"], kw: ["homemade", "home-made", "bake", "baked", "cookies", "potluck"] },
  { id: "R09", text: "USG food and service requests (rentals, setup, lighting).", limit: "10 business days before", src: ["usg"], kw: ["usg", "funding", "fund", "money", "request", "food"] },
  { id: "R10", text: "USG guest speaker or performer requests need a signed SAP agreement.", limit: "14 business days before", src: ["usg"], kw: ["speaker", "performer", "guest", "sap", "honorarium"] },
  { id: "R11", text: "USG purchase requests need the event flyer and a public-purpose statement. Invoices are addressed to ASU, reimbursements are capped at $999, Amazon purchases may not be reimbursed, and checks arrive in about 3 weeks.", limit: "—", src: ["usg"], kw: ["reimburse", "reimbursement", "receipt", "amazon", "999", "flyer", "invoice", "cap", "limit"] },
  { id: "R12", text: "Meals at $25 or more per person need a Business Meals Form and an attendance list.", limit: "—", src: ["usgr"], kw: ["per person", "business meal", "attendance", "$25", "25"] },
  { id: "R13", text: "No events during final exams.", limit: "—", src: ["hb"], kw: ["finals", "final exam", "exam week"] },
  { id: "R14", text: "Student officers should avoid signing legally binding contracts.", limit: "—", src: ["hb"], kw: ["contract", "sign", "agreement", "venue contract"] },
  { id: "R15", text: "ASU cannot run raffles. Free ticket drawings where everyone has an equal chance are allowed.", limit: "—", src: ["hb"], kw: ["raffle", "drawing", "lottery", "prize", "giveaway"] },
  { id: "R16", text: "Officer transition: contact the advisor; new officers complete training and read the handbook and constitution; update Sun Devil Central and bank accounts; re-register every spring.", limit: "Spring", src: ["hb"], kw: ["transition", "handoff", "new officer", "re-register", "reregister", "training", "bank"] }
];
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const RULES_CHECKED = "Oct 7, 2026";

/* ---------------- Organization (fictional) ---------------- */
const OFFICERS = [
  { id: "alex", name: "Alex Rivera", role: "President", email: "alex.rivera@example.org", since: "President since Spring 2026", otherMin: 240 },
  { id: "maya", name: "Maya Chen", role: "Treasurer", email: "maya.chen@example.org", since: "Treasurer since Fall 2025", otherMin: 330 },
  { id: "jordan", name: "Jordan Patel", role: "Events lead", email: "jordan.patel@example.org", since: "New this month", otherMin: 45 },
  { id: "sam", name: "Sam Okafor", role: "Marketing lead", email: "sam.okafor@example.org", since: "Marketing lead since Fall 2026", otherMin: 90 },
  { id: "priya", name: "Priya Nair", role: "Secretary", email: "priya.nair@example.org", since: "Secretary since Fall 2026", otherMin: 30 }
];
const OFF = Object.fromEntries(OFFICERS.map(o => [o.id, o]));
const roleOwner = role => (OFFICERS.find(o => o.role === role) || {}).id || null;

/* ---------------- The rule engine (deterministic) ----------------
   schedule(brief) returns steps with startBy / planBy / official due.
   planBy = when we aim to finish; it includes a buffer.
   Buffer for USG review uses the 80th percentile of officer reports
   (one-tap question after each approval) instead of the official minimum. */
function p80(arr) { // arr = counts for 1,2,3,4+ weeks
  const n = arr.reduce((a, b) => a + b, 0); let c = 0;
  for (let i = 0; i < arr.length; i++) { c += arr[i]; if (c / n >= 0.8) return { weeks: i + 1, n }; }
  return { weeks: 4, n };
}

function schedule(brief, opts = {}) {
  const ev = sod(brief.date), T = opts.today || TODAY;
  const usgStat = p80(STATE.reports.usg);
  const steps = []; const S = {};
  const add = o => { steps.push(o); S[o.key] = o; return o; };
  const campus = brief.venue === "campus";
  const food = brief.food; // none | offsite | dining | onsite
  const usg = brief.funding === "usg";

  if (campus) {
    const due = addDays(ev, -16);
    add({ key: "venue", title: "Reserve the room in Mazevo", role: "Events lead", rules: ["R03"], due, dueNote: "16 days before", minutes: 20,
      planBy: minD(prevBiz(due), addBiz(T, 5)), why: "Only the top three officers can submit, and popular rooms go early." });
    const due30 = addDays(ev, -30), due14 = addDays(ev, -14);
    add({ key: "registry", title: "Register the event in Event Registry", role: "President", rules: ["R01"], due: due30, dueNote: "30 days before (Handbook)", altDue: due14, minutes: 25,
      planBy: prevBiz(due30), why: "Event Registry says 14 days and the Handbook says 30. Platypus plans for the stricter 30 days.", conflict: true });
  }
  if (food === "offsite") {
    add({ key: "quote", title: "Get the restaurant quote and insurance certificate", role: "Treasurer", rules: ["R06"], due: null, minutes: 30, why: "The Food Exception Request and the USG request both need the quote." });
    const due = addDays(ev, -14);
    add({ key: "foodex", title: "Submit the Food Exception Request", role: "Treasurer", rules: ["R06"], due, dueNote: "14 days before", minutes: 25,
      planBy: addBiz(prevBiz(due), -5), why: "Outside food needs this approval plus the vendor's insurance.", after: ["quote"] });
  }
  if (food === "dining") {
    const due = addDays(ev, -14);
    add({ key: "dining", title: "Order catering from Sun Devil Dining", role: "Events lead", rules: ["R05"], due, dueNote: "2 weeks before", minutes: 30, planBy: addBiz(prevBiz(due), -3), why: "This venue uses Sun Devil Dining only." });
  }
  if (food === "onsite") {
    const due = addBiz(ev, -7);
    add({ key: "onsite", title: "Apply for the temporary food permit ($85)", role: "Treasurer", rules: ["R07", "R08"], due, dueNote: "7 business days before", minutes: 30, planBy: addBiz(due, -3), why: "Food made on site needs a permit. Homemade food is not allowed." });
  }
  if (brief.speaker) {
    const due = addBiz(ev, -14);
    add({ key: "speaker", title: "Get the speaker's signed SAP agreement", role: "President", rules: ["R10"], due, dueNote: "14 business days before", minutes: 40, planBy: addBiz(due, -5), why: "USG pays guests only with a signed agreement on file." });
  }
  if (usg && food !== "none") {
    const due = addBiz(ev, -10);
    const official = addBiz(due, -5);
    const crowd = prevBiz(addDays(ev, -(usgStat.weeks * 7 + 3)));
    add({ key: "usg", title: "Submit the USG food request", role: "Treasurer", rules: ["R09", "R11"], due, dueNote: "10 business days before", minutes: 30,
      planBy: minD(official, crowd), after: ["quote", "flyer"].filter(k => S[k] || k === "flyer"),
      why: `USG asks for 10 business days. Officers report reviews take up to ${usgStat.weeks} weeks (80% of ${usgStat.n} reports), so Platypus plans for that.`,
      bufferNote: { official: fmtD(due), crowdWeeks: usgStat.weeks, n: usgStat.n } });
    add({ key: "flyer", title: "Finish the event flyer", role: "Marketing lead", rules: ["R11"], due: null, minutes: 60, planBy: addBiz(S.usg.planBy, -2), why: "USG requires the flyer with the funding request." });
  }
  if (S.quote) S.quote.planBy = addBiz(minD(S.foodex && S.foodex.planBy, S.usg && S.usg.planBy), -4);
  if (campus) {
    const due = addDays(ev, -14);
    const base = maxD(S.registry.planBy, S.venue.planBy);
    add({ key: "ritm", title: "Add the RITM number to the room request", role: "Events lead", rules: ["R04"], due, dueNote: "14 days before", minutes: 10,
      planBy: minD(addBiz(base, 2), prevBiz(due)), after: ["registry", "venue"], why: "Without it the room booking can be canceled." });
  }
  add({ key: "rsvp", title: "Publish the event and open RSVPs in Sun Devil Central", role: "Marketing lead", rules: [], due: null, minutes: 20,
    planBy: S.usg ? S.usg.planBy : prevBiz(addDays(ev, -21)), why: "Caterers need a headcount. Last fall, 40% of RSVPs came (example)." });
  if (campus) add({ key: "advisor", title: "Confirm the advisor will attend", role: "President", rules: ["R02"], due: prevBiz(ev), dueNote: "before the event", minutes: 5, planBy: prevBiz(addDays(ev, -14)), why: "Advisor attendance is required for student-organization events." });
  if (food !== "none") add({ key: "headcount", title: "Send the final headcount to the caterer", role: "Events lead", rules: [], due: null, minutes: 15, planBy: prevBiz(addDays(ev, -3)), after: ["rsvp"], why: "Order for expected turnout, not RSVPs." });
  const perHead = brief.budget && brief.headcount ? brief.budget / brief.headcount : 0;
  add({ key: "closeout", title: "Close out: receipts, attendance and two recap questions", role: "Treasurer", rules: ["R11"].concat(perHead >= 25 ? ["R12"] : []), due: null, minutes: 40, planBy: addBiz(ev, 3),
    why: "Reimbursements are capped at $999. The recap goes into next year's handbook." + (perHead >= 25 ? " Over $25 per person needs a Business Meals Form." : "") });

  if (opts.ai) { // AI suggestions: non-rule steps the AI proposes; the president decides
    add({ key: "runshow", title: "Draft the run-of-show", role: "Events lead", rules: [], due: null, minutes: 45, planBy: prevBiz(addDays(ev, -7)), ai: true, why: "A minute-by-minute plan so every officer knows their job on the night." });
    add({ key: "outreach", title: "Invite alumni and two partner clubs", role: "Marketing lead", rules: [], due: null, minutes: 30, planBy: prevBiz(addDays(ev, -18)), ai: true, why: "Networking events draw more when guests come from outside the club." });
    add({ key: "signin", title: "Print name tags and the sign-in sheet", role: "Secretary", rules: [], due: null, minutes: 20, planBy: prevBiz(addDays(ev, -2)), ai: true, why: "The sign-in sheet doubles as the attendance list for closeout." });
  }

  for (const s of steps) {
    if (!s.planBy) s.planBy = s.due ? prevBiz(s.due) : addDays(ev, -7);
    if (inBreak(s.planBy) && ev > new Date(2027, 0, 10)) { s.planBy = prevBiz(new Date(2026, 11, 18)); s.breakNote = "Moved before winter break"; }
    s.startBy = addBiz(s.planBy, s.minutes >= 45 ? -3 : -2);
    if (s.key === "closeout") s.startBy = addBiz(ev, 1);
    s.late = s.due && s.due < T ? "past" : (s.planBy < T ? "behind" : null);
    s.owner = roleOwner(s.role);
  }
  steps.sort((a, b) => a.planBy - b.planBy || a.startBy - b.startBy);
  return steps;
}

function matchRules(q) {
  const s = " " + q.toLowerCase() + " ";
  return RULES.map(r => ({ r, score: r.kw.reduce((a, k) => a + (s.includes(k) ? (k.length > 4 ? 2 : 1) : 0), 0) }))
    .filter(x => x.score > 0).sort((a, b) => b.score - a.score);
}
const CANNED = [
  { test: /pizza|restaurant|off-campus|outside (food|cater)/i, ids: ["R05", "R06"], text: "Not from an outside restaurant if the event is in the Memorial Union. Those venues use Aramark / Sun Devil Dining only [R05]. In other campus spaces, outside food is allowed if you submit a Food Exception Request with the vendor's insurance certificate at least 14 days before the event [R06]." },
  { test: /how (early|far|soon).*(register|registry)|register.*(how|when)/i, ids: ["R01"], text: "Register at least 30 days before the event [R01]. The Event Registry page says 14 days, but the 2025–26 Handbook says 30, so Platypus uses the stricter date and shows both sources." },
  { test: /homemade|bake|cookies|potluck/i, ids: ["R08", "R07"], text: "No. Homemade food may not be served at student-organization events [R08]. If you want to prepare food on site, you need a temporary food permit ($85) at least 7 business days ahead [R07]." },
  { test: /raffle|lottery/i, ids: ["R15"], text: "ASU cannot run raffles. A free drawing where everyone has an equal chance and no one pays is allowed [R15]." },
  { test: /reimburse|amazon|receipt/i, ids: ["R11"], text: "USG reimbursements are capped at $999, and Amazon purchases may not be reimbursed. Invoices should be addressed to ASU. Checks usually arrive in about 3 weeks [R11]." },
  { test: /speaker|performer|honorarium/i, ids: ["R10"], text: "Submit the USG guest request at least 14 business days before the event, with the speaker's signed SAP agreement attached [R10]." }
];
function answerFor(q) {
  const m = matchRules(q);
  const scope = Math.min(0.97, 0.35 + (m[0] ? m[0].score * 0.12 : 0) + (m.length > 1 ? 0.08 : 0));
  if (!STATE.ai) return { who: "assistant", mode: "search", q, results: m.slice(0, 4).map(x => x.r.id) };
  if (/\b(best|recommend|favou?rite|cheapest|near campus|reviews?|tastiest)\b/i.test(q)) return { who: "assistant", refuse: true, scope: 0.12, text: "That isn't covered by the ASU rule book, so I won't guess. I can help with the rules for bringing outside food to an event." };
  const canned = CANNED.find(c => c.test.test(q));
  if (canned) return { who: "assistant", text: canned.text, cites: canned.ids, scope: Math.max(scope, 0.9) };
  if (m.length && m[0].score >= 2) {
    const r = m[0].r;
    return { who: "assistant", text: `Here is what the rule book says: ${r.text} Time limit: ${r.limit}. [${r.id}]`, cites: [r.id], scope };
  }
  return { who: "assistant", refuse: true, scope: Math.min(scope, 0.31),
    text: "I couldn't find this in the rule book, so I won't guess. For ASU student-organization policy, ask the Tempe Student Organizations office at tempeclubs@asu.edu. If it's about club money, ask USG." };
}
function classifyReply(text) {
  const s = text.toLowerCase();
  const rules = [
    { label: "help", re: /\b(help|idk|not sure|confused|stuck|don'?t know|how do i|\?)/, conf: 0.52 },
    { label: "waiting", re: /\b(waiting|pending|submitted|sent it|hear back|no reply|haven'?t heard)/, conf: 0.9 },
    { label: "done", re: /\b(done|finished|completed|approved|booked|confirmed)/, conf: 0.93 }
  ];
  let hit = null;
  for (const r of rules) if (r.re.test(s)) { if (!hit || r.conf > hit.conf || (r.label === "help" && /\?/.test(s))) hit = r; }
  if (!hit) return { label: "other", conf: 0.4 };
  const both = rules.filter(r => r.re.test(s)).length > 1;
  return { label: hit.label, conf: both ? Math.min(hit.conf, 0.48) : hit.conf };
}

  const out = {}; for (const o of OFFICERS) out[o.id] = { min: o.otherMin, open: 0 };

  for (const t of STATE.tasks) { if (t.status === "done" || !t.owner) continue; out[t.owner].open++; if (t.startBy <= horizon) out[t.owner].min += t.minutes; }

function defaultBrief() {
  return { name: "Spring Speaker Night", date: new Date(2027, 1, 18), headcount: 60, venue: "campus", food: "offsite", funding: "usg", speaker: true, money: false, budget: 1500 };
}
const DEFAULT_SENTENCE = "Spring Speaker Night on Thursday, Feb 18, about 60 people, pizza from an off-campus restaurant, a guest speaker, USG funding, $1,500 budget.";
function parseSentence(s, base) {
  const b = { ...base }; const t = s.toLowerCase();
  const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const m = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/);
  const n = t.match(/\b(\d{1,2})\/(\d{1,2})\b/);
  let mo = null, d = null;
  if (m) { mo = months.indexOf(m[1]); d = +m[2]; } else if (n) { mo = +n[1] - 1; d = +n[2]; }
  if (mo !== null) { let y = TODAY.getFullYear(); let cand = new Date(y, mo, d); if (cand < TODAY) cand = new Date(y + 1, mo, d); b.date = cand; }
  const hc = t.match(/(?:about|around|~)?\s*(\d{2,4})\s*(?:people|guests|attendees|students|members)/); if (hc) b.headcount = +hc[1];
  const bud = t.match(/\$\s?([\d,]+)/); if (bud) b.budget = +bud[1].replace(/,/g, "");
  if (/off-campus|restaurant|pizza|cater/.test(t)) b.food = "offsite"; else if (/sun devil dining|aramark/.test(t)) b.food = "dining"; else if (/cook|grill|bbq|on site|on-site/.test(t)) b.food = "onsite"; else if (/no food/.test(t)) b.food = "none";
  if (/usg|student government/.test(t)) b.funding = "usg"; else if (/dues/.test(t)) b.funding = "dues"; else if (/sponsor/.test(t)) b.funding = "sponsor";
  b.speaker = /speaker|panel|guest|performer/.test(t);
  b.money = /ticket|sell|fundrais/.test(t);
  if (/off campus trip|trip to|outside campus venue/.test(t)) b.venue = "offcampus";
  const name = s.match(/^([A-Z][\w'’-]*(?:\s+[A-Z][\w'’-]*){0,4})\s+(?:on|at)\b/); if (name) b.name = name[1];
  return b;
}
function briefFields(b) {
  return `<div class="brief">
    <label for="bName">Event<input id="bName" value="${esc(b.name)}"></label>
    <label for="bDate">Date<input id="bDate" type="date" value="${ymd(b.date)}"></label>
    <label for="bHead">People<input id="bHead" type="number" min="1" value="${b.headcount}"></label>
    <label for="bVenue">Venue<select id="bVenue"><option value="campus"${b.venue === "campus" ? " selected" : ""}>Campus room</option><option value="offcampus"${b.venue === "offcampus" ? " selected" : ""}>Off campus</option></select></label>
    <label for="bFood">Food<select id="bFood">${[["none", "No food"], ["offsite", "Outside restaurant"], ["dining", "Sun Devil Dining"], ["onsite", "Made on site"]].map(([v, l]) => `<option value="${v}"${b.food === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <label for="bFund">Funding<select id="bFund">${[["usg", "USG"], ["dues", "Member dues"], ["sponsor", "Sponsor"], ["none", "None"]].map(([v, l]) => `<option value="${v}"${b.funding === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>

function planHtml(plan) {
  const steps = plan.steps;
  const on = steps.filter(s => s.include !== false);
  const owners = new Set(on.map(s => s.owner).filter(Boolean));
  const first = on.reduce((a, s) => (a && a.startBy < s.startBy ? a : s), null);
  const late = on.filter(s => s.late);
  const weeks = {}; on.forEach(s => { const k = ymd(addDays(s.planBy, -((s.planBy.getDay() + 6) % 7))); weeks[k] = (weeks[k] || 0) + 1; });
  const busy = Object.entries(weeks).sort((a, b) => b[1] - a[1])[0];
  const usg = steps.find(s => s.key === "usg");
  return `
  <section class="card">

    <div class="summary-strip">
      <div class="stat"><b class="num">${on.length}</b><span>steps</span></div>

      <div class="stat"><b class="num">${busy ? busy[1] : 0}</b><span>steps in the busiest week (${busy ? "week of " + fmtS(new Date(busy[0] + "T00:00")) : "—"})</span></div>
    </div>
    ${late.length ? `<div class="note late" style="margin-top:12px">${I.warn}<div><b>${late.length} step${late.length > 1 ? "s are" : " is"} already late for this date.</b> Options: move the event later, switch to a faster funding source, or drop the item that needs approval (for example, outside food).</div></div>` : ""}
    ${usg ? `<div class="note ai" style="margin-top:12px">${I.cal}<div><b>Why the USG request starts early:</b> USG asks for 10 business days (deadline ${usg.bufferNote.official}). In ${usg.bufferNote.n} officer reports, 80% of approvals came within ${usg.bufferNote.crowdWeeks} weeks, so Platypus plans for that plus 3 days to confirm the caterer. <a href="#budget">See the reports</a></div></div>` : ""}

  <ol class="steps">${steps.map((s, i) => stepHtml(s, i)).join("")}</ol>
  <section class="card">

      <span class="small muted">Creates the tasks and drafts each action card. You still press Send for every email.</span>
      <span class="spacer"></span>${bts("ai", "API", "POST /api/plan/approve → tasks[] + cards[]")}
    </div>
  </section>`;
}
function stepHtml(s, i) {
  const ownerOpts = `<option value="">No owner</option>` + OFFICERS.map(o => `<option value="${o.id}"${s.owner === o.id ? " selected" : ""}>${esc(o.name.split(" ")[0])} · ${esc(o.role)}</option>`).join("");
  return `<li class="step${s.include === false ? " off" : ""}${s.ai ? " is-ai" : ""}${s.late ? " is-late" : ""}">
    <input type="checkbox" data-act="inc" data-i="${i}" ${s.include === false ? "" : "checked"} aria-label="Include ${esc(s.title)}">
    <div>
      <h3>${esc(s.title)}</h3>
      <p class="why">${esc(s.why)}</p>
      <div class="meta">
        ${s.ai ? '<span class="tag tag-ai">AI suggestion · no ASU rule</span>' : ruleTags(s.rules)}
        ${s.conflict ? '<span class="tag tag-warn">Sources disagree</span>' : ""}
        ${s.breakNote ? `<span class="tag tag-warn">${s.breakNote}</span>` : ""}
        ${s.late ? `<span class="tag tag-late">${s.late === "past" ? "Past the official deadline" : "Behind plan"}</span>` : ""}
        ${s.after && s.after.length ? `<span class="small muted">after: ${s.after.map(k => esc(shortTitle({ title: (plan().steps.find(x => x.key === k) || {}).title || k }))).join(", ")}</span>` : ""}
        ${bts(s.ai ? "ai" : "rule", s.ai ? "AIR" : "Rule", s.ai ? "proposed step; president keeps or drops it" : "date = official limit − buffer")}
      </div>
      ${s.ownerNote ? `<div class="note ai small" style="margin-top:8px">${I.spark}<div>Suggested owner: ${esc(s.ownerNote)}</div></div>` : ""}
    </div>
    <div class="dates">
      <div><span>Start</span><b>${fmtD(s.startBy)}</b></div>
      <div><span>Finish by</span><b>${fmtD(s.planBy)}</b></div>
      <div><span>Deadline</span><b>${s.due ? fmtD(s.due) : "—"}</b></div>
      <div><span>Time</span><b>${s.minutes} min</b></div>
      <select data-act="owner" data-i="${i}" aria-label="Owner for ${esc(s.title)}">${ownerOpts}</select>
    </div>
  </li>`;
}
const plan = () => STATE.plan;

/* ----- Tasks ----- */
function viewTasks() {
  const f = STATE.filter;
  const me = STATE.viewer;
  const all = STATE.tasks.slice().sort((a, b) => a.startBy - b.startBy);
  const fl = {
    all: () => true, mine: t => t.owner === me, unowned: t => !t.owner && t.status !== "done", waiting: t => t.status === "waiting",
    late: t => !!lateOf(t), event: t => t.event === "e1", done: t => t.status === "done"
  };
  const list = all.filter(fl[f] || fl.all);
  const counts = k => all.filter(fl[k]).length;
  const filters = [["all", "All"], ["mine", "Mine"], ["unowned", "No owner"], ["waiting", "Waiting"], ["late", "Behind plan"], ["event", "Networking Night"], ["done", "Done"]];
  return `
  <section class="page-head">
    <p class="eyebrow">Tasks</p>
    <h1>Who's doing what</h1>
    <p class="lede">Every task has one owner. A task without an owner is marked red until someone takes it.</p>
  </section>
  <div class="chips" role="group" aria-label="Filter tasks">${filters.map(([k, l]) => `<button class="chip" type="button" data-act="filter" data-f="${k}" aria-pressed="${f === k}">${l} <span class="num muted">${counts(k)}</span></button>`).join("")}</div>
  <section class="card">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Task</th><th>Owner</th><th>Start</th><th>Finish by</th><th>Status</th></tr></thead>
      <tbody>${list.map(t => `<tr class="${!t.owner && t.status !== "done" ? "unowned" : ""}" id="row-${t.id}">
        <td><div class="tl-title">${esc(t.title)}</div><div class="tl-meta">${eventOf(t) ? esc(eventOf(t).name) : "Ongoing"}${ruleTags(t.rules)}${t.ai ? '<span class="tag tag-ai">AI suggestion</span>' : ""}${t.waitingOn ? `<span>· waiting: ${esc(t.waitingOn)}</span>` : ""}</div></td>
        <td><select data-act="assign" data-id="${t.id}" aria-label="Owner">${'<option value="">No owner</option>' + OFFICERS.map(o => `<option value="${o.id}"${t.owner === o.id ? " selected" : ""}>${esc(o.name.split(" ")[0])}</option>`).join("")}</select></td>
        <td class="num">${fmtS(t.startBy)}</td>
        <td class="num">${fmtS(t.planBy)}${t.due ? `<div class="small muted">deadline ${fmtS(t.due)}</div>` : ""}</td>
        <td><select data-act="status" data-id="${t.id}" aria-label="Status">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}"${t.status === k ? " selected" : ""}>${l}</option>`).join("")}</select>${lateOf(t) ? `<div style="margin-top:4px">${pill(t.status, lateOf(t))}</div>` : ""}</td>
      </tr>`).join("") || '<tr><td colspan="5" class="muted">No tasks match this filter.</td></tr>'}</tbody>
    </table></div>
    <div class="bts-row" style="margin-top:10px">${bts("rule", "Data", "Tasks table: owner, startBy, planBy, due, status, after[] (dependencies)")}</div>
  </section>
  ${STATE.ai ? `<section class="card">
    <header><h2>Replies from officers</h2><p>Platypus reads short replies and updates the status. Unclear replies go to you.</p></header>
    <div class="stack">${STATE.replies.map(r => replyHtml(r)).join("")}</div>
    <hr class="sep" style="margin:12px 0">
    <form class="ask-bar" data-form="classify"><input id="replyIn" placeholder="Try a reply, e.g. “sent it, still waiting on USG”" aria-label="Officer reply"><button class="btn" type="submit">Read reply</button></form>
    <div class="bts-row" style="margin-top:8px">${bts("ai", "AIR Verdicts", "choice: done | waiting | help | other, with probability · POST /api/replies/classify")}</div>
  </section>` : ""}`;
}
function replyHtml(r) {
  const lab = { done: ["Done", "done"], waiting: ["Submitted – waiting", "waiting"], help: ["Needs help", "stuck"], other: ["Unclear", "todo"] }[r.label];
  const low = r.conf < 0.6;
  const t = r.taskId ? task(r.taskId) : null;
  return `<div class="note">${avatar(r.from)}<div style="flex:1;min-width:0"><b>${esc(OFF[r.from] ? OFF[r.from].name.split(" ")[0] : "Officer")}</b> <span class="muted">“${esc(r.text)}”</span>
    <div class="row small" style="margin-top:6px"><span class="pill st-${lab[1]}">${lab[0]}</span><span class="muted num">confidence ${Math.round(r.conf * 100)}%</span>${t ? `<span class="muted">· ${esc(t.title)}</span>` : ""}
    ${low ? '<span class="tag tag-warn">Sent to Alex to check</span>' : '<span class="tag">Status updated</span>'}</div></div></div>`;
}

/* ----- Ready to send (click-to-send) ----- */

/* ----- Action card (officer's view) + comparison ----- */

  const n = ev ? ev.headcount : 30;
  const up = upstreamOf(t); const down = downstreamOf(t);
  const weeksOut = ev ? Math.round(diffDays(ev.date, TODAY) / 7) : 0;
  const pickable = (isPres() ? STATE.tasks.filter(x => x.event && x.owner && x.status !== "done") : myTasks(STATE.viewer)).slice(0, 14);
  const ready = t.key === "usg" ? [
    ["Public-purpose statement", "Connects 30 members with local professionals for career networking and mentoring."],
    ["Line items", ev && ev.id === "e1" ? "Catering $1,400 · Room setup $350 · Printing and supplies $250" : `Budget ${money(ev ? ev.budget : 0)}`],
    ["Attachments", "Restaurant quote (in event folder) · Flyer from Sam"]

  const cardHtml = `
  <article class="acard" aria-label="Action card">
    <div class="acard-head">
      <span class="urg">${t.startBy <= TODAY ? "Start today" : "Starts " + fmtD(t.startBy)} · about ${t.minutes} min</span>
      <h2>${esc(t.title)}${ev ? " for " + esc(ev.name) : ""}</h2>
      <p class="small">Hi ${esc(o.name.split(" ")[0])}, this one is yours as ${esc(o.role)}.</p>
    </div>
    <div class="acard-body">
      <div class="kv"><span>WHY</span><div>${esc(t.why)}</div></div>
      <div class="kv"><span>WHEN</span><div>Start <b>${fmtD(c.slot.day)}</b>, suggested ${fmtTime(c.slot.from)}–${fmtTime(c.slot.to)}. Finish by <b>${fmtD(t.planBy)}</b>.${t.due ? ` Official deadline ${fmtD(t.due)}.` : ""}
        <div class="row" style="margin-top:8px"><a class="btn" href="${esc(calLink(t.title, c.slot, "Platypus action card"))}" target="_blank" rel="noopener">${I.cal}Add this slot to my calendar</a></div></div></div>
      <div class="kv"><span>HOW</span><ol>${(HOW[t.key] || ["Follow the steps in Platypus."]).map(s => `<li>${esc(s.replace("{n}", n))}</li>`).join("")}</ol></div>
      ${ready.length ? `<div class="kv"><span>READY</span><div class="ready">${ready.map(([k, v]) => `<div class="ready-item"><div class="t"><b>${esc(k)}</b><div class="muted">${esc(v)}</div></div><button class="iconbtn" type="button" data-act="copy" data-text="${esc(v)}" aria-label="Copy ${esc(k)}">${I.copy}</button></div>`).join("")}${STATE.ai ? `<div class="bts-row">${bts("ai", "AIR", "drafted the statement; officer edits freely")}</div>` : ""}</div></div>` : ""}
      <div class="kv"><span>CHAIN</span><div class="stack"><div class="mylink">
        <div class="box">${up.length ? up.map(u => `<b>${esc(shortTitle(u))}</b><span class="muted">${u.owner ? esc(OFF[u.owner].name.split(" ")[0]) : "No owner"} · ${STATUS[u.status]}</span>`).join("<br>") : '<span class="muted">Nothing before this step.</span>'}</div>
        <span class="ar" aria-hidden="true">→</span>
        <div class="box me"><b>You: ${esc(shortTitle(t))}</b><span class="muted">finish by ${fmtS(t.planBy)}</span></div>
        <span class="ar" aria-hidden="true">→</span>
        <div class="box">${down.length ? down.map(d => `<b>${esc(OFF[d.who] ? OFF[d.who].name.split(" ")[0] : "Teammate")}</b><span class="muted">${esc(d.text)}</span>`).join("<br>") : '<span class="muted">No one is waiting on this.</span>'}</div>
      </div>
      ${t.key === "usg" && ev ? `<p class="small" style="margin-top:8px"><b>If this slips a week:</b> approval can take up to ${p80(STATE.reports.usg).weeks} weeks, so it may land after ${fmtS(addDays(ev.date, -3))}, when the restaurant needs the final order. Then the club pays out of pocket or drops the food.</p>` : ""}
      </div></div>
      <div class="kv"><span>STATUS</span><div class="status-btns" role="group" aria-label="Update status">
        ${[["done", "Done"], ["waiting", "Submitted – waiting"], ["help", "Need help"], ["stuck", "Stuck"]].map(([k, l]) => `<button class="btn" type="button" data-act="cardStatus" data-k="${k}" aria-pressed="${(t.status === k) || (k === "help" && t.status === "stuck" && t.help)}">${l}</button>`).join("")}
      </div></div>

        <div class="onetap" style="margin-top:8px">${[1, 2, 3, 4].map(w => `<button class="btn" type="button" data-act="report" data-w="${w}">${w === 4 ? "4+" : w} week${w > 1 ? "s" : ""}</button>`).join("")}</div>

    ${cardHtml}
  </div>` : cardHtml}
  <div class="bts-row">${bts("rule", "Rule engine", "WHEN, CHAIN and deadlines")}${bts(STATE.ai ? "ai" : "rule", STATE.ai ? "AIR" : "Template", "WHY and READY wording")}${bts("ai", "API", "status buttons → PATCH /api/tasks/:id · one-tap → POST /api/reports")}</div>`;
}

function viewAsk() {

  return `
  <section class="page-head">

    <h1>${ai ? "Answers from the rule book, with sources" : "Search the rule book"}</h1>
    <p class="lede">${ai ? "Platypus answers only from the ASU rule book and links every claim. If the rule book doesn't cover it, Platypus says so and tells you who to ask." : "AI is off. You get matching rules and their sources, with no generated text."}</p>
  </section>
  <section class="card chat" id="chat">${STATE.chat.map(m => chatMsg(m)).join("")}</section>
  <form class="ask-bar" data-form="ask"><input id="askIn" placeholder="${ai ? "Ask about ASU club rules" : "Search rules, e.g. food, room, raffle"}" aria-label="Question" autocomplete="off"><button class="btn btn-primary" type="submit">${ai ? "Ask" : "Search"}</button></form>

  <div class="bts-row">${ai ? bts("ai", "Step 1 · AIR Verdicts", "boolean: can the rule book answer this? below threshold → decline") + bts("ai", "Step 2 · AIR chat", "rule book in the prompt; answer must cite [Rxx]") + bts("ai", "API", "POST /api/ask") : bts("rule", "Search", "keyword match on Rules.kw, no AI")}</div>`;
}
function chatMsg(m) {
  if (m.who === "user") return `<div class="msg user"><span class="avatar" aria-hidden="true">${initials(OFF[STATE.viewer].name)}</span><div class="bubble">${esc(m.text)}</div></div>`;
  if (m.pending) return `<div class="msg"><span class="avatar" aria-hidden="true">P</span><div class="bubble"><div class="loading"><span class="dots"><i></i><i></i><i></i></span>Checking the rule book</div></div></div>`;
  if (m.mode === "search") return `<div class="msg"><span class="avatar" aria-hidden="true">P</span><div class="bubble">${m.results.length ? `<b>${m.results.length} matching rule${m.results.length > 1 ? "s" : ""}</b>${m.results.map(id => `<div><span class="tag">${id}</span> ${esc(RULE[id].text)} <span class="muted small">${esc(RULE[id].limit)}</span></div>`).join("")}` : "No rule matches. Try another word, or email tempeclubs@asu.edu."}</div></div>`;
  const text = esc(m.text).replace(/\[(R\d\d)\]/g, (_, id) => `<a class="tag" href="#rules" data-act="rule" data-id="${id}">${id}</a>`);
  return `<div class="msg"><span class="avatar" aria-hidden="true">P</span><div class="bubble${m.refuse ? " refuse" : ""}"><div>${text}</div>
    ${m.cites && m.cites.length ? `<div class="cites">Sources: ${m.cites.map(id => RULE[id].src.map(k => `<a href="${SRC[k].url}" target="_blank" rel="noopener">${esc(SRC[k].label)}</a>`).join(", ")).join("; ")} · checked ${RULES_CHECKED}</div>` : ""}
    <div class="row small">${m.refuse ? '<span class="tag">Outside the rule book</span>' : `<button class="btn btn-quiet" type="button" data-act="flagAns">${I.flag}This looks outdated</button><button class="btn btn-quiet" type="button" data-act="copy" data-text="${esc(m.text)}">${I.copy}Copy</button>`}${bts("ai", "Scope", Math.round(m.scope * 100) + "% in scope")}</div></div></div>`;
}

    contacts: [["Partner club: Women in Business (example)", "Co-promotion", "Swap posts a week before each event"]],
    left: 6
  },
  "President": {
    why: [["The plan is approved once per event", "Officers get their reminders without the president writing them."], ["Register 30 days out", "The two official sources disagree; we follow the stricter one."]],
    contacts: [["Student Organizations office (Tempe)", "Policy questions", "tempeclubs@asu.edu"]],

};
function viewHandoff() {

  return `
  <section class="page-head">
    <p class="eyebrow">Handoff</p>
    <h1>${esc(role)} handbook</h1>

  </section>
  <div class="tabs" role="tablist">${Object.keys(HANDBOOK).map(r => `<button role="tab" type="button" aria-selected="${r === role}" data-act="role" data-role="${esc(r)}">${esc(r)}</button>`).join("")}</div>
  <div class="grid-2">
    <section class="card">
      <header><h2>Key dates this semester</h2><p>From ${doneCount} completed and ${roleTasks.filter(t => t.status !== "done").length} open tasks</p></header>

      <div class="bts-row" style="margin-top:8px">${bts("rule", "Built from", "Tasks + Lessons tables")}${bts("ai", "AIR", "summary text · GET /api/handbook/:role")}</div>
    </section>
    <section class="card">
      <header><h2>How we do it, and why</h2><p>Written by the outgoing ${esc(role.toLowerCase())}</p></header>
      <div class="stack">${h.why.map(([a, b]) => `<div><b>${esc(a)}</b><p class="small muted">${esc(b)}</p></div>`).join("")}</div>
    </section>
  </div>
  <div class="grid-2">
    <section class="card">
      <header><h2>Contacts</h2><p>Relationships leave when people graduate. Their details shouldn't.</p></header>
      <div>${h.contacts.length ? h.contacts.map(([n, w, tip]) => `<div class="contact">${I.link.replace("<svg", '<svg width="18" height="18"')}<div><b>${esc(n)}</b><div class="small muted">${esc(w)} · ${esc(tip)}</div></div></div>`).join("") : '<p class="muted small">No contacts saved yet.</p>'}</div>
      ${STATE.ai ? `<div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="toast" data-msg="Introduction email drafted for the outgoing officer to send.">${I.mail}Draft an introduction email</button></div>` : ""}
    </section>
    <section class="card">
      <header><h2>Exit interview</h2><p>${8 - h.left} of 8 answered${holder ? " by " + esc(holder.name.split(" ")[0]) : ""}</p></header>
      <div class="bar" style="margin-bottom:12px"><i style="width:${((8 - h.left) / 8 * 100).toFixed(0)}%"></i></div>
      <ol class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">
        <li>The 3 most important things this role does each semester</li><li>The step most likely to go wrong, and how you noticed</li><li>Deadlines that aren't written down anywhere</li><li>Who you contact, and what to ask each person</li><li>What you do on purpose, and why</li><li>The most useful templates and where they are</li><li>What you would change</li><li>The one thing your successor should do in week one</li>
      </ol>
      <div class="bts-row" style="margin-top:8px">${bts("ai", "AIR", "turns answers into handbook entries; outgoing officer confirms")}</div>
    </section>
  </div>
  <section class="card">
    <header><h2>Officer transition checklist</h2><p>ASU steps plus moving Platypus itself <span class="tag">R16</span></p></header>
    <ul class="checklist">
      ${["Contact the advisor about the new officer team", "New top-three officers complete ASU officer training", "Update officers in Sun Devil Central", "Update signers on the club bank account", "Re-register the organization (every spring)", "Move Platypus ownership to the new president and re-enter quick links"].map((x, i) => `<li><input type="checkbox" id="tr${i}"><label for="tr${i}">${esc(x)}</label></li>`).join("")}

}

/* ----- Budget ----- */
function viewBudget() {
  const b = budgetTotals();
  const rep = STATE.reports.usg; const n = rep.reduce((a, c) => a + c, 0); const max = Math.max(...rep);
  const p = p80(rep);
  return `
  <section class="page-head">
    <p class="eyebrow">Budget</p>
    <h1>Funding status by event</h1>
    <p class="lede">Platypus tracks where each request stands. It is not a full ledger; your budget spreadsheet stays the record.</p>
  </section>
  <section class="card">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Event</th><th>Amount</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody>${STATE.budget.requests.map(r => `<tr><td>${esc(r.event)}</td><td class="num">${money(r.amount)}</td><td>${budgetPill(r.status)}</td><td class="small muted">${esc(r.lines || r.date)}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="small muted" style="margin-top:10px">${money(b.remaining)} left of the example ${money(STATE.budget.allocation)} allocation if planned requests are approved.</p>
  </section>
  <section class="card">
    <header><h2>How long USG approval takes</h2><p>Example reports from officers (${n}), not survey data</p></header>
    <div class="hist" role="img" aria-label="Approval time reports">${rep.map((c, i) => `<div class="col"><div class="b${i + 1 > p.weeks ? " over" : ""}" style="height:${(c / max * 100).toFixed(1)}%"><em>${c}</em></div><div class="lab">${i === 3 ? "4+" : i + 1} wk</div></div>`).join("")}</div>
    <div class="note ai" style="margin-top:14px">${I.cal}<div><b>80% of approvals came within ${p.weeks} weeks.</b> Platypus uses ${p.weeks} weeks as the buffer, not the official 10 business days, and not the average (which would leave half of requests late). Each new report updates this.</div></div>
    <div class="bts-row" style="margin-top:8px">${bts("rule", "Computed", "80th percentile of Reports where process = usg_food; at least 5 reports before replacing the default")}${bts("ai", "API", "POST /api/reports")}</div>
  </section>`;
}

/* ----- Rule book ----- */
function viewRules() {
  return `
  <section class="page-head">
    <p class="eyebrow">Rule book</p>
    <h1>ASU rules Platypus schedules from</h1>
    <p class="lede">Every date in Platypus comes from one of these rules. Each one links to its source and shows when it was checked. These were checked on ${RULES_CHECKED}; verify before relying on them.</p>
