  <section class="card">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>ID</th><th>Rule</th><th>Time limit</th><th>Source</th></tr></thead>
      <tbody>${RULES.map(r => `<tr id="rule-${r.id}" class="${STATE.flash === r.id ? "flash" : ""}"><td><span class="tag">${r.id}</span></td><td>${esc(r.text)}${r.flag ? `<div style="margin-top:4px"><span class="tag tag-warn">${esc(r.flag)}</span></div>` : ""}</td><td class="small">${esc(r.limit)}</td><td class="small">${r.src.map(k => `<a href="${SRC[k].url}" target="_blank" rel="noopener">${esc(SRC[k].label)}</a>`).join("<br>")}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="row" style="margin-top:12px"><span class="small muted">${STATE.flags.length} rule${STATE.flags.length === 1 ? "" : "s"} flagged as outdated, waiting for review.</span><span class="spacer"></span>${bts("rule", "Source of truth", "Google Sheet published as CSV · GET /api/rules")}</div>
  </section>`;
}

/* ----- How it works (for the committee) ----- */
function viewHow() {
  return `
  <section class="page-head">
    <p class="eyebrow">How it works · for reviewers</p>
    <h1>Rules set the dates. AI drafts. People approve.</h1>
    <p class="lede">This is the Option C build for Phase 3: a static site on Netlify, small server functions that call ASU's AIR models, and Gmail and Calendar links that officers click themselves.</p>
  </section>
  <section class="card">
    <header><h2>Where each part runs</h2><p>Dashed = AI · solid dark = rules · grey = simulated in this prototype</p></header>
    <div class="flow">
      <div class="lane"><span>In the browser</span>
        <div class="box"><b>This page</b>HTML, CSS, JS on Netlify. No keys, no secrets.</div>
        <div class="box rule"><b>Rule engine</b>schedule(): business days, holidays, buffers. Runs here now; moves server-side.</div></div>
      <div class="lane"><span>Netlify Functions</span>
        <div class="box mock"><b>/api/*</b>Thin server code. Holds the AIR key in an environment variable.</div>
        <div class="box mock"><b>Data store</b>Org, Officers, Events, Tasks, Reports. Choice pending: Netlify Blobs, Supabase or a Google Sheet.</div></div>
      <div class="lane"><span>ASU AIR</span>
        <div class="box ai mock"><b>Chat · JSON schema</b>Plan drafts, card wording, handbook summaries.</div>
        <div class="box ai mock"><b>Verdicts</b>Is this question in scope? What does this reply mean? Returns a probability.</div></div>
      <div class="lane"><span>Tools officers already use</span>
        <div class="box rule"><b>Google Sheet → CSV</b>The rule book. Public rules only.</div>
        <div class="box rule"><b>Gmail compose link</b>President reviews, then presses Send.</div>
        <div class="box rule"><b>Calendar link</b>The officer's own calendar is the alarm.</div></div>
    </div>
  </section>
  <section class="card">
    <header><h2>API contract</h2><p>Each mock in this file has the same name and shape</p></header>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Endpoint</th><th>Called when</th><th>Returns</th><th>Who decides</th></tr></thead>
      <tbody>
        <tr><td><code>POST /api/plan/draft</code></td><td>Draft the plan</td><td>steps[]: title, role, ruleRefs, aiSuggested, minutes</td><td>AIR proposes; rule engine dates it</td></tr>
        <tr><td><code>POST /api/plan/approve</code></td><td>President approves</td><td>tasks[], cards[]</td><td>President</td></tr>
        <tr><td><code>POST /api/cards/draft</code></td><td>Card needed</td><td>subject, body, slot</td><td>AIR words it; dates fixed</td></tr>
        <tr><td><code>PATCH /api/tasks/:id</code></td><td>Status button, owner change</td><td>task</td><td>Officer</td></tr>
        <tr><td><code>POST /api/ask</code></td><td>Ask Platypus</td><td>inScope, confidence, answer, citations[]</td><td>Verdicts gate, then AIR with rule book</td></tr>
        <tr><td><code>POST /api/replies/classify</code></td><td>Officer replies</td><td>label, confidence</td><td>Verdicts; low confidence goes to president</td></tr>
        <tr><td><code>POST /api/reports</code></td><td>One-tap after approval</td><td>p80 weeks, n</td><td>Officers' reports</td></tr>
        <tr><td><code>GET /api/rules</code></td><td>Page load</td><td>rules[]</td><td>Published Google Sheet</td></tr>
        <tr><td><code>GET /api/handbook/:role</code></td><td>Handoff page</td><td>sections</td><td>Task history + AIR summary</td></tr>
        <tr><td><code>POST /api/flags</code></td><td>"This looks outdated"</td><td>ok</td><td>President reviews</td></tr>
      </tbody>
    </table></div>
  </section>
  <div class="grid-2">
    <section class="card">
      <header><h2>Data tables</h2></header>
      <div class="tbl-wrap"><table class="tbl small">
        <tbody>
          ${[["Org", "name, mission, links[]"], ["Officers", "name, role, email, term"], ["Events", "brief fields, status"], ["Rules", "id, text, limit, buffer, source, checked"], ["Playbooks", "event type → steps"], ["Tasks", "owner, startBy, planBy, due, status, after[]"], ["Messages", "card sent, by whom, when"], ["Reports", "process, weeks (one-tap)"], ["Contacts", "who, what for, tips"], ["Handbooks", "role, entries, confirmed by"], ["Flags", "rule, note, reviewed"]].map(([a, b]) => `<tr><td><b>${a}</b></td><td class="muted">${b}</td></tr>`).join("")}
        </tbody></table></div>
      <p class="small muted" style="margin-top:8px">No member lists, student IDs or phone numbers.</p>
    </section>
    <section class="card">
      <header><h2>What's real in v0.1</h2></header>
      <ul class="checklist small">
        <li><span class="pill st-done">Real</span><span>Rule engine dates, business days, holidays, the 80th-percentile buffer</span></li>
        <li><span class="pill st-done">Real</span><span>Gmail compose links and Google Calendar links</span></li>
        <li><span class="pill st-done">Real</span><span>Rule book with source links (checked ${RULES_CHECKED})</span></li>
        <li><span class="pill st-todo">Mock</span><span>All AI output: plan drafts, answers, reply reading</span></li>
        <li><span class="pill st-todo">Mock</span><span>Data store: in memory, resets on reload</span></li>
      </ul>
      <hr class="sep" style="margin:12px 0">
      <h3>Settings that change at handoff</h3>
      <p class="small muted" style="margin-top:4px">Three server settings, in one place: <code>AI_BASE_URL</code> (${esc(CONFIG.aiBaseUrl)}), <code>AI_MODEL</code>, <code>AI_KEY</code>. A new maintainer replaces the key; rules and data stay.</p>
    </section>
  </div>`;
}

/* ---------------- Router ---------------- */
const VIEWS = { dashboard: viewDashboard, plan: viewPlan, tasks: viewTasks, outbox: viewOutbox, card: viewCard, ask: viewAsk, handoff: viewHandoff, budget: viewBudget, rules: viewRules, how: viewHow };
function current() {
  let h = (location.hash || "").replace("#", "");
  if (!VIEWS[h]) h = "dashboard";
  if (!isPres() && (h === "plan" || h === "outbox")) h = "dashboard";
  return h;
}
function render(focus) {
  const v = current();
  renderNav(v);
  $("#view").innerHTML = VIEWS[v]();
  renderRail();
  document.documentElement.classList.toggle("show-bts", STATE.bts);
  if (focus) { $("#view").focus({ preventScroll: true }); window.scrollTo(0, 0); }
  if (v === "rules" && STATE.flash) { const r = document.getElementById("rule-" + STATE.flash); if (r) r.scrollIntoView({ block: "center" }); setTimeout(() => { STATE.flash = null; }, 50); }
}

/* ---------------- Events ---------------- */
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600); }
function copy(text) {
  try { navigator.clipboard.writeText(text).then(() => toast("Copied"), () => toast("Copy is blocked here. Select the text and copy it.")); }
  catch (e) { toast("Copy is blocked here. Select the text and copy it."); }
}
function savePrefs() { try { localStorage.setItem("platypus-prefs", JSON.stringify({ viewer: STATE.viewer, ai: STATE.ai, bts: STATE.bts })); } catch (e) {} }
function loadPrefs() { try { return JSON.parse(localStorage.getItem("platypus-prefs") || "{}"); } catch (e) { return {}; } }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "filter") { STATE.filter = el.dataset.f; if (current() === "tasks") { e.preventDefault(); render(); } return; }
  if (act === "rule") { STATE.flash = el.dataset.id; if (current() === "rules") { e.preventDefault(); render(); } return; }
  if (act === "opencard") { if (el.dataset.id) STATE.card = el.dataset.id; if (current() === "card") { e.preventDefault(); render(true); } return; }
  if (act === "role") { STATE.handoffRole = el.dataset.role; if (current() === "handoff") { e.preventDefault(); render(); } return; }
  if (act === "copy") { copy(el.dataset.text); return; }
  if (act === "toast") { toast(el.dataset.msg); return; }
  if (act === "reset") { const v = STATE.viewer, a = STATE.ai, b = STATE.bts; STATE = freshState(); STATE.viewer = v; STATE.ai = a; STATE.bts = b; seedDemo(); render(true); toast("Demo reset"); return; }
  if (act === "parse") {
    const s = $("#sentence").value; STATE.sentence = s;
    el.disabled = true; el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span> Reading';
    await wait(700);
    STATE.planBrief = parseSentence(s, readBrief()); STATE.plan = null; render(); toast("Brief filled in. Check it, then draft the plan."); return;
  }
  if (act === "draft") {
    STATE.planBrief = readBrief(); if (STATE.ai && $("#sentence")) STATE.sentence = $("#sentence").value;
    $("#planOut").innerHTML = `<section class="card"><div class="loading"><span class="dots"><i></i><i></i><i></i></span>${STATE.ai ? "Platypus is drafting steps and checking each date against the rule book" : "Building the plan from the rule book"}</div></section>`;
    const res = await api.draftPlan(STATE.sentence, STATE.planBrief);
    STATE.plan = { brief: STATE.planBrief, steps: res.steps };
    $("#planOut").innerHTML = planHtml(STATE.plan); return;
  }
  if (act === "inc") { const s = STATE.plan.steps[+el.dataset.i]; s.include = el.checked; $("#planOut").innerHTML = planHtml(STATE.plan); return; }
  if (act === "approve") {
    const steps = STATE.plan.steps.filter(s => s.include !== false);
    el.disabled = true;
    const r = await api.approvePlan(STATE.plan.brief, steps);
    const name = STATE.plan.brief.name;
    STATE.plan = null; STATE.planBrief = null; STATE.sentence = null;
    toast(`${name} approved: ${r.created} tasks created.`);
    location.hash = "tasks"; STATE.filter = "all"; render(true); return;
  }
  if (act === "toggleMail") { const m = document.getElementById(el.dataset.id); m.classList.toggle("open"); el.textContent = m.classList.contains("open") ? "Hide text" : "Show text"; return; }
  if (act === "opened") { setTimeout(() => toast("Gmail opened in a new tab. Press Send there, then mark it as sent."), 100); return; }
  if (act === "markSent") { const m = STATE.outbox.find(x => x.id === el.dataset.id); m.sent = !m.sent; render(); toast(m.sent ? "Marked as sent" : "Moved back to ready"); return; }
  if (act === "cardStatus") {
    const t = task(STATE.card); const k = el.dataset.k;
    if (k === "help") { t.status = "stuck"; t.help = true; toast("Alex gets a note that you need help."); }
    else { t.status = k; t.help = false; toast(k === "done" ? "Marked done. Teammates waiting on you are notified." : k === "waiting" ? "Marked as submitted. Platypus will check back in 5 business days." : "Marked stuck. Alex will see it."); }
    render(); return;
  }
  if (act === "report") { const r = await api.report("usg", +el.dataset.w); toast(`Thanks. ${r.n} reports now; 80% within ${r.weeks} weeks.`); render(); return; }
  if (act === "suggest") { askQuestion(el.dataset.q); return; }
  if (act === "flagAns") { STATE.flags.push({ at: new Date() }); toast("Flagged. Alex will review the rule before it changes."); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "viewer") { STATE.viewer = el.value; STATE.filter = STATE.viewer === "alex" ? "all" : "mine"; if (!isPres() && (current() === "plan" || current() === "outbox")) location.hash = "dashboard"; savePrefs(); render(true); return; }
  if (el.id === "aiToggle") { STATE.ai = el.checked; STATE.plan = null; savePrefs(); render(); toast(STATE.ai ? "AI features on" : "Rules-only mode: no AI text anywhere"); return; }
  if (el.id === "btsToggle") { STATE.bts = el.checked; savePrefs(); document.documentElement.classList.toggle("show-bts", STATE.bts); return; }
  if (el.id === "cmpToggle") { STATE.compare = el.checked; render(); return; }
  if (el.id === "cardPick") { STATE.card = el.value; render(); return; }
  if (el.dataset.act === "owner") { const s = STATE.plan.steps[+el.dataset.i]; s.owner = el.value || null; s.ownerNote = null; $("#planOut").innerHTML = planHtml(STATE.plan); return; }
  if (el.dataset.act === "assign") { const t = task(el.dataset.id); t.owner = el.value || null; rebuildOutbox(); toast(t.owner ? `Assigned to ${OFF[t.owner].name.split(" ")[0]}` : "Owner removed"); render(); return; }
  if (el.dataset.act === "status") { const t = task(el.dataset.id); t.status = el.value; render(); return; }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "ask") { const q = $("#askIn").value.trim(); if (q) askQuestion(q); }
  if (f.dataset.form === "classify") {
    const text = $("#replyIn").value.trim(); if (!text) return;
    const r = await api.classify(text);
    STATE.replies.unshift({ from: STATE.viewer === "alex" ? "maya" : STATE.viewer, text, label: r.label, conf: r.conf });
    render();
  }
});
async function askQuestion(q) {
  STATE.chat.push({ who: "user", text: q }); const pend = { who: "assistant", pending: true }; STATE.chat.push(pend); render();
  const c = $("#chat"); if (c) c.lastElementChild.scrollIntoView({ block: "nearest" });
  const a = await api.ask(q); STATE.chat[STATE.chat.indexOf(pend)] = a; render();
  const c2 = $("#chat"); if (c2) c2.lastElementChild.scrollIntoView({ block: "nearest" });
}
window.addEventListener("hashchange", () => render(true));

/* ---------------- Boot ---------------- */
STATE = freshState();
const prefs = loadPrefs();
STATE.viewer = OFF[prefs.viewer] ? prefs.viewer : "alex";
STATE.ai = prefs.ai !== false;
STATE.bts = !!prefs.bts;
STATE.filter = STATE.viewer === "alex" ? "all" : "mine";
seedDemo();
$("#viewer").value = STATE.viewer; $("#aiToggle").checked = STATE.ai; $("#btsToggle").checked = STATE.bts;
renderOfficers();
render();
</script>

</body>
