name: CI
on:
  push:
    branches: [main, v1]
  pull_request:
jobs:
  check:
    # Pinned, not ubuntu-latest: GitHub moved that label to Ubuntu 26.04 overnight on
    # 2026-10-27 and Playwright 1.56.1 cannot install chromium there, so every run failed
    # at the browser install step before a single test ran. Raise this deliberately once
    # Playwright supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css
      - run: npm run lint:js
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run words
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
