name: CI
on:
  push:
    branches: [main, v1]
  pull_request:
jobs:
  check:
    # Keep the runner image stable during toolchain upgrades. The previous automatic
    # ubuntu-latest change broke browser installation before tests could run.
    # Change this image only after verifying the browser install and suite on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css
      - run: npm run lint:js
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run words
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
