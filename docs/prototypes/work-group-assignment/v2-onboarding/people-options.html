<style>

#platypus-people-options .po-split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:23px;align-items:start}#platypus-people-options .po-compact .po-node{padding:12px 9px;max-width:180px}#platypus-people-options .po-compact .po-tree,#platypus-people-options .po-compact .po-tree ul{gap:10px}#platypus-people-options .po-compact .po-role{font-size:13px}#platypus-people-options .po-person{display:block;font-size:12px;color:var(--po-sub)}#platypus-people-options .po-editor{background:var(--po-paper);border:1px solid var(--po-line);border-radius:14px;padding:20px;display:grid;gap:16px}#platypus-people-options .po-editor label{display:grid;gap:6px;font-size:12px;color:var(--po-sub)}#platypus-people-options .po-editor input,#platypus-people-options .po-editor select{width:100%;padding:9px 10px;border:1px solid var(--po-line);border-radius:9px;background:var(--po-paper);color:var(--po-ink);min-height:40px}#platypus-people-options .po-editor .po-personmeta{border-bottom:1px solid var(--po-line);padding-bottom:14px;display:grid;gap:6px}#platypus-people-options .po-editor .po-personmeta h2{font-size:21px}#platypus-people-options .po-editor .po-note{font-size:12px;color:var(--po-sub)}
@media(max-width:760px){#platypus-people-options .po{--po-height:1355px}#platypus-people-options .po-head{padding:20px 17px;gap:18px}#platypus-people-options .po-progress li span{display:none}#platypus-people-options .po-main{padding:18px 18px}#platypus-people-options .po-split{grid-template-columns:1fr}#platypus-people-options .po-compact .po-tree .po-node{max-width:210px}#platypus-people-options .po-compact .po-role{font-size:14px}}

@media(pointer:coarse){#platypus-people-options .po-btn,#platypus-people-options .po-node input{min-height:44px}#platypus-people-options .po-node input,#platypus-people-options .po-editor input,#platypus-people-options .po-editor select{font-size:16px}}

<script>
(function(){
const root=document.getElementById('platypus-people-options');
const defaults=[
{id:'president',role:'President',name:'Alex Rivera',email:'alex.rivera@example.org',parent:null},
{id:'evp',role:'Executive Vice President',name:'Jordan Patel',email:'jordan.patel@example.org',parent:'president'},
{id:'finance',role:'Treasurer',name:'Maya Chen',email:'maya.chen@example.org',parent:'evp'},
{id:'finance-assoc',role:'Finance Associate',name:'Chris Lee',email:'chris.lee@example.org',parent:'finance'},
{id:'marketing',role:'Marketing Director',name:'Sam Okafor',email:'sam.okafor@example.org',parent:'evp'},
{id:'marketing-assoc',role:'Marketing Associate',name:'Riley Brooks',email:'',parent:'marketing'},
{id:'secretary',role:'Secretary',name:'Priya Nair',email:'priya.nair@example.org',parent:'evp'}];
let state={roles:structuredClone(defaults),selected:'finance',sendInvites:true,message:''};const design={theme:'Follow device',emails:true};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);}
function ready(){return state.roles.filter(function(r){return r.name.trim()&&validEmail(r.email);}).length;}
function children(id){return state.roles.filter(function(r){return r.parent===id;});}
function descendants(id){return children(id).flatMap(function(r){return [r.id].concat(descendants(r.id));});}
function depth(r){let d=0,p=r.parent;const seen=new Set();while(p&&!seen.has(p)){seen.add(p);d++;const found=state.roles.find(function(x){return x.id===p;});p=found&&found.parent;}return d;}
function flatten(id){return children(id).flatMap(function(r){return [r].concat(flatten(r.id));});}
function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{review:'Onboarding people and hierarchy',selectedRole:state.selected,emailInvitesReady:ready(),roles:state.roles.length},privateContent:{people:state,design:design}}).catch(function(){});}
function hydrate(s){const p=s&&s.privateContent;if(!p||!p.people||!Array.isArray(p.people.roles)||p.people.roles.length>30)return;const roles=p.people.roles;if(roles.some(function(r){return !r||typeof r.id!=='string'||typeof r.name!=='string'||typeof r.email!=='string'||typeof r.role!=='string';}))return;const ids=new Set(roles.map(function(r){return r.id;}));if(ids.size!==roles.length)return;for(const r of roles){const seen=new Set([r.id]);let id=r.parent;while(id){if(!ids.has(id)||seen.has(id))return;seen.add(id);id=roles.find(function(x){return x.id===id;}).parent;}}state=p.people;if(p.design)Object.assign(design,p.design);}
hydrate(window.openai&&window.openai.widgetState);
function header(){const names=['Name','Constitution','Goals','Team','First event','Reminders','Confirm','Invite'];return '<header class="po-head"><div class="po-brand"><span class="po-mark" aria-hidden="true"></span>Platypus</div><ol class="po-progress" aria-label="Onboarding progress">'+names.map(function(n,i){return '<li class="'+(i<3?'past':i===3?'now':'')+'" '+(i===3?'aria-current="step"':'')+'><i aria-hidden="true"></i><span>'+n+'</span></li>';}).join('')+'</ol><button class="po-btn" type="button" data-action="save">Exit</button></header>';}
function intro(){return '<div class="po-eyebrow">Step 4 of 8 · Team</div><div class="po-intro"><h1>Your club, at a glance.</h1><p class="po-sub">Review the roles from your constitution.</p></div><div class="po-tabs"><span class="active">People</span><span>Work groups</span></div><div class="po-toolbar"><span class="po-small">'+state.roles.length+' positions · <span data-ready-count>'+ready()+'</span> invite emails ready</span><button type="button" class="po-btn quiet" data-action="add">+ Add role</button></div>';}
function footer(){return '<footer class="po-footer"><label class="po-check"><input type="checkbox" data-invites '+(state.sendInvites?'checked':'')+'>Email invitations after setup</label><button type="button" class="po-btn primary" data-action="save">Save team</button></footer><div class="po-flash" role="status" aria-live="polite">'+esc(state.message)+'</div>';}
function card(r,compact){return compact?'<button type="button" class="po-node '+(r.id==='president'?'president ':'')+(state.selected===r.id?'selected':'')+'" data-select-role="'+r.id+'" data-role-node="'+r.id+'"><span class="po-role" data-display-role="'+r.id+'">'+esc(r.role)+'</span><span class="po-person" data-display-name="'+r.id+'">'+esc(r.name||'Open position')+'</span><span data-email-state="'+r.id+'" class="po-ready '+(!validEmail(r.email)?'missing':'')+'">'+(validEmail(r.email)?'✓ Email ready':'+ Add email')+'</span></button>':'<article class="po-node '+(r.id==='president'?'president':'')+'" data-role-node="'+r.id+'"><h3 class="po-role" data-display-role="'+r.id+'">'+esc(r.role)+'</h3><input aria-label="Name for '+esc(r.role)+'" data-person="'+r.id+'" data-field="name" value="'+esc(r.name)+'" placeholder="Open position">'+(design.emails?'<input class="po-email" type="email" aria-label="Email for '+esc(r.role)+'" data-person="'+r.id+'" data-field="email" value="'+esc(r.email)+'" placeholder="+ Email for invitation">':'')+'</article>';}
function tree(id,compact){return '<ul class="'+(id===null?'po-tree':'')+'">'+children(id).map(function(r){return '<li>'+card(r,compact)+(children(r.id).length?tree(r.id,compact):'')+'</li>';}).join('')+'</ul>';}
function treeView(compact){return '<div class="po-tree-wrap '+(compact?'po-compact':'')+'"><svg class="po-edges" aria-hidden="true"></svg>'+tree(null,compact)+'</div>';}
function editor(){const r=state.roles.find(function(x){return x.id===state.selected;})||state.roles[0];const blocked=new Set([r.id].concat(descendants(r.id)));return '<aside class="po-editor" aria-label="Selected officer"><div class="po-personmeta"><span class="po-small">Selected position</span><h2>'+esc(r.role)+'</h2></div><label>Position title<input data-person="'+r.id+'" data-field="role" value="'+esc(r.role)+'"></label><label>Name<input data-person="'+r.id+'" data-field="name" value="'+esc(r.name)+'" placeholder="Open position"></label><label>Email for invitation<input type="email" data-person="'+r.id+'" data-field="email" value="'+esc(r.email)+'" placeholder="name@example.org"></label><label>Reports to<select aria-label="Reports to" data-parent="'+r.id+'" '+(r.id==='president'?'disabled':'')+'><option value="">Nobody · top role</option>'+state.roles.filter(function(x){return !blocked.has(x.id);}).map(function(x){return '<option value="'+x.id+'" '+(r.parent===x.id?'selected':'')+'>'+esc(x.role)+'</option>';}).join('')+'</select></label><p class="po-note">'+(validEmail(r.email)?'✓ Invitation email ready.':'Add an email to prepare an invitation.')+'</p></aside>';}
function outline(){return '<div class="po-outline" role="table" aria-label="Officer hierarchy"><div class="po-outlinehead" role="row"><span>Position &amp; reporting line</span><span>Name</span><span>Email for invitation</span></div>'+flatten(null).map(function(r){return '<div class="po-outlinerow '+(r.id==='president'?'president':'')+'" style="--depth:'+depth(r)+'" role="row"><div class="po-outlinerole" role="cell"><button type="button" data-outline-select="'+r.id+'">'+esc(r.role)+'</button></div><input aria-label="Name for '+esc(r.role)+'" data-person="'+r.id+'" data-field="name" value="'+esc(r.name)+'" placeholder="Open position"><input type="email" aria-label="Email for '+esc(r.role)+'" data-person="'+r.id+'" data-field="email" value="'+esc(r.email)+'" placeholder="+ Add email"></div>';}).join('')+'</div>';}
function departmentCards(r){return card(r,false)+children(r.id).map(departmentCards).join('');}
function departments(){const rootRole=state.roles.find(function(r){return r.id==='president';}),vp=state.roles.find(function(r){return r.id==='evp';});return '<div class="po-leadership">'+card(rootRole,false)+card(vp,false)+'</div><div class="po-departments">'+children('evp').map(function(r){const label=r.id==='finance'?'Finance':r.id==='marketing'?'Marketing':r.id==='secretary'?'Operations':r.role;return '<section class="po-dept"><div class="po-dept-label">'+esc(label)+'</div>'+departmentCards(r)+'</section>';}).join('')+'</div>';}
function drawEdges(){root.querySelectorAll('.po-tree-wrap').forEach(function(w){if(!w.offsetWidth)return;const box=w.getBoundingClientRect(),svg=w.querySelector('.po-edges');svg.setAttribute('viewBox','0 0 '+w.clientWidth+' '+w.clientHeight);let paths='';state.roles.forEach(function(r){if(!r.parent)return;const a=w.querySelector('[data-role-node="'+r.parent+'"]'),b=w.querySelector('[data-role-node="'+r.id+'"]');if(!a||!b)return;const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),x=ra.x+ra.width/2-box.x,y=ra.bottom-box.y,u=rb.x+rb.width/2-box.x,v=rb.top-box.y,m=(y+v)/2;paths+='<path d="M '+x+' '+y+' V '+m+' H '+u+' V '+v+'" />';});svg.innerHTML=paths;});}
function render(){root.querySelectorAll('[data-view]').forEach(function(el){const view=el.dataset.view;let main=view==='tree'?treeView(false):view==='outline'?outline():view==='departments'?departments():'<div class="po-split">'+treeView(true)+editor()+'</div>';if(view==='outline'&&state.outlineEditor)main+='<div style="margin-top:20px">'+editor()+'</div>';el.innerHTML=header()+'<main class="po-main">'+intro()+main+footer()+'</main>';el.style.colorScheme=design.theme==='Light'?'light':design.theme==='Dark'?'dark':'';});requestAnimationFrame(drawEdges);}
root.addEventListener('input',function(e){const el=e.target;if(!el.dataset.person)return;const r=state.roles.find(function(x){return x.id===el.dataset.person;});if(!r)return;r[el.dataset.field]=el.value;
root.querySelectorAll('[data-person="'+r.id+'"][data-field="'+el.dataset.field+'"]').forEach(function(peer){if(peer!==el)peer.value=el.value;});
root.querySelectorAll('[data-ready-count]').forEach(function(n){n.textContent=ready();});
root.querySelectorAll('[data-display-name="'+r.id+'"]').forEach(function(n){n.textContent=r.name||'Open position';});
root.querySelectorAll('[data-display-role="'+r.id+'"]').forEach(function(n){n.textContent=r.role;});
root.querySelectorAll('[data-email-state="'+r.id+'"]').forEach(function(n){n.classList.toggle('missing',!validEmail(r.email));n.textContent=validEmail(r.email)?'✓ Email ready':'+ Add email';});requestAnimationFrame(drawEdges);save();});
root.addEventListener('change',function(e){const el=e.target;if(el.dataset.parent){const r=state.roles.find(function(x){return x.id===el.dataset.parent;});if(r&&el.value!==r.id&&!descendants(r.id).includes(el.value)){r.parent=el.value||null;render();save();}}else if(el.matches('[data-invites]')){state.sendInvites=el.checked;save();}});
root.addEventListener('click',function(e){const select=e.target.closest('[data-select-role],[data-outline-select]');if(select){state.selected=select.dataset.selectRole||select.dataset.outlineSelect;state.outlineEditor=!!select.dataset.outlineSelect;render();save();return;}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='save')state.message='Team saved for review. '+ready()+' invitation emails prepared.';if(b.dataset.action==='add'){const id='role-'+(state.roles.length+1);state.roles.push({id:id,role:'New role',name:'',email:'',parent:'evp'});state.selected=id;state.message='New position added under Executive Vice President.';}render();save();});
window.addEventListener('openai:set_globals',function(e){hydrate(e.detail&&e.detail.globals&&e.detail.globals.widgetState);render();});
render();const ro=new ResizeObserver(drawEdges);ro.observe(root);new MutationObserver(function(){requestAnimationFrame(drawEdges);}).observe(root,{subtree:true,attributes:true,attributeFilter:['hidden']});window.addEventListener('resize',drawEdges);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:function(){render();save();}});tweak.addSelect(design,'theme',{label:'界面外观',options:[{label:'跟随系统',value:'Follow device'},{label:'浅色',value:'Light'},{label:'深色',value:'Dark'}]});tweak.addToggle(design,'emails',{label:'名片直接显示邮箱'});}
})();
</script>
