<script>
(function(){
const root=document.getElementById('platypus-workflow-options');const data=JSON.parse(document.getElementById('onboarding-workflow-data').textContent);const tasks=data.tasks,groups=data.groups,byKey=Object.fromEntries(tasks.map(function(t){return [t.key,t];}));
let state={focus:'finance',selected:'foodCompliance',assignment:{},openStages:['prepare','money'],message:'',undo:null};const design={theme:'Follow device',shortLabels:true,showLines:true};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function groupOf(key){return state.assignment[key]||byKey[key].group;}
function group(id){return groups.find(function(g){return g.id===id;});}
function count(id){return tasks.filter(function(t){return groupOf(t.key)===id;}).length;}
function name(t){return design.shortLabels?t.short:t.title;}
function color(id){return 'var(--wo-'+id+')';}
function selected(key){return state.selected===key;}
function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{review:'Onboarding full-template grouping',templateTasks:tasks.length,source:data.sourceCommit,focusedGroup:state.focus,selectedTask:state.selected,assignments:Object.fromEntries(tasks.map(function(t){return [t.key,groupOf(t.key)];}))},privateContent:{workflow:state,design:design}}).catch(function(){});}
function hydrate(s){const p=s&&s.privateContent;if(!p||!p.workflow||!group(p.workflow.focus)||!byKey[p.workflow.selected])return;const assignment=p.workflow.assignment||{};if(Object.entries(assignment).some(function(x){return !byKey[x[0]]||!group(x[1]);}))return;state=p.workflow;if(!Array.isArray(state.openStages))state.openStages=['prepare','money'];if(p.design)Object.assign(design,p.design);}
hydrate(window.openai&&window.openai.widgetState);
function header(){const labels=['Name','Constitution','Goals','Team','First event','Reminders','Confirm','Invite'];return '<header class="wo-head"><div class="wo-brand"><span class="wo-mark" aria-hidden="true"></span>Platypus</div><ol class="wo-progress" aria-label="Onboarding progress">'+labels.map(function(n,i){return '<li class="'+(i<3?'past':i===3?'now':'')+'" '+(i===3?'aria-current="step"':'')+'><i aria-hidden="true"></i><span>'+n+'</span></li>';}).join('')+'</ol><button type="button" class="wo-btn" data-action="save">Exit</button></header>';}
function intro(){return '<div class="wo-eyebrow">Step 4 of 8 · Team</div><div class="wo-intro"><h1>Give every task a home.</h1><p class="wo-sub">Your full event workflow. Select a group to see its work.</p></div><div class="wo-tabs"><span>People</span><span class="active">Work groups</span></div><div class="wo-toolbar"><div><b>Event workflow template</b><div class="wo-small">All paths · '+tasks.length+' tasks · original dependencies kept</div></div><span class="wo-coverage">✓ '+tasks.length+' / '+tasks.length+' grouped</span></div>';}
function chips(view){return '<div class="wo-chiprow" aria-label="Focus a work group">'+groups.map(function(g){return '<button class="wo-chip" type="button" aria-pressed="'+(state.focus===g.id)+'" data-focus-group="'+g.id+'" style="--gc:'+color(g.id)+'"><span class="wo-swatch" aria-hidden="true"></span>'+g.name+' <span class="wo-count" data-group-count="'+g.id+'">'+count(g.id)+'</span></button>';}).join('')+'</div>'+(view==='paint'?'<div class="wo-brushmeta"><b>Brush: '+group(state.focus).name+'</b><span>Click or sweep over tasks.</span></div>':'');}
function groupOptions(current){return groups.map(function(g){return '<option value="'+g.id+'" '+(current===g.id?'selected':'')+'>'+g.name+'</option>';}).join('');}
function taskAttrs(t){return 'data-task="'+t.key+'" data-tooltip="'+esc(t.title)+' · '+group(groupOf(t.key)).name+'" aria-label="'+esc(t.short)+'; '+esc(t.title)+'; '+group(groupOf(t.key)).name+'" style="--gc:'+color(groupOf(t.key))+'"';}
function station(t,kind){const owner=groupOf(t.key);return '<button type="button" class="'+(kind||'wo-station')+' '+(owner===state.focus?'focused ':'')+(selected(t.key)?'selected':'')+'" '+taskAttrs(t)+'><span class="wo-stop" aria-hidden="true"></span><span>'+esc(name(t))+'</span></button>';}
function inspector(){const t=byKey[state.selected];return '<section class="wo-inspector" aria-label="Selected template task"><div><span class="wo-small">Selected task · '+data.phaseNames[t.phase]+'</span><h2>'+esc(t.short)+'</h2><p>Original: '+esc(t.title)+'</p><details class="wo-detail"><summary>Requirements &amp; dependencies</summary><p>'+esc(t.why)+'</p><p>Waits for: '+(t.dependsOn.length?t.dependsOn.map(function(k){return esc(byKey[k].title);}).join(' · '):'No prerequisite')+'</p><p>Source: '+esc(t.source)+(t.ruleIds.length?' · '+t.ruleIds.join(', '):'')+'</p></details></div><label>Work group<select class="wo-select" data-assign-selected>'+groupOptions(groupOf(t.key))+'</select><span class="wo-small">Dates and requirements stay intact.</span></label></section>';}
function footer(){return '<footer class="wo-foot"><span class="wo-small">Two-word labels · full details on selection</span><button class="wo-btn primary" type="button" data-action="save">Save work groups</button></footer><div class="wo-flash" role="status" aria-live="polite">'+(state.message?'<span>'+esc(state.message)+'</span>':'')+(state.undo?'<button class="wo-btn quiet" type="button" data-action="undo">Undo</button>':'')+'</div>';}
function topological(){const seen=new Set(),out=[];function visit(t){if(seen.has(t.key))return;seen.add(t.key);t.dependsOn.forEach(function(k){visit(byKey[k]);});out.push(t);}tasks.forEach(visit);return out;}
const ordered=topological();
function metro(){return '<div class="wo-map"><svg class="wo-lines" aria-hidden="true"></svg><div class="wo-metrogrid" aria-label="All 46 template stations">'+ordered.map(function(t){return station(t);}).join('')+'</div></div>';}
function lanes(){
const weights=data.phaseOrder.map(function(p){const n=tasks.filter(function(t){return t.phase===p&&groupOf(t.key)===state.focus;}).length;return 'minmax(65px,'+(1+Math.sqrt(n)).toFixed(2)+'fr)';});
return '<div class="wo-swim" style="--wo-lane-cols:115px '+weights.join(' ')+'"><div class="wo-lanehead"><span>Work group</span>'+data.phaseOrder.map(function(p){return '<span>'+data.phaseNames[p]+'</span>';}).join('')+'</div>'+groups.map(function(g){const active=g.id===state.focus;return '<section class="wo-lane '+(active?'active':'')+'"><div class="wo-lanename" style="--gc:'+color(g.id)+'"><span class="wo-swatch" aria-hidden="true"></span>'+g.name+' <span class="wo-count">'+count(g.id)+'</span></div>'+data.phaseOrder.map(function(p){return '<div class="wo-lanecell '+(!active?'dots':'')+'" data-phase-label="'+data.phaseNames[p]+'">'+ordered.filter(function(t){return t.phase===p&&groupOf(t.key)===g.id;}).map(function(t){return active?station(t,'wo-tile'):'<button type="button" class="wo-bead '+(selected(t.key)?'selected':'')+'" '+taskAttrs(t)+'></button>';}).join('')+'</div>';}).join('')+'</section>';}).join('')+'</div>';}
function stages(){return '<div>'+data.phaseOrder.map(function(p){const list=ordered.filter(function(t){return t.phase===p;}),open=state.openStages.includes(p);return '<section class="wo-stage"><button class="wo-stagehead" type="button" data-toggle-stage="'+p+'" aria-expanded="'+open+'"><b>'+data.phaseNames[p]+'</b><span>'+list.length+' tasks · '+(open?'−':'+')+'</span></button>'+(open?'<div class="wo-stagegrid">'+list.map(function(t){return station(t,'wo-tile');}).join('')+'</div>':'<div class="wo-beads" aria-label="All '+list.length+' tasks in '+p+'">'+list.map(function(t){return '<button type="button" class="wo-bead '+(selected(t.key)?'selected':'')+'" '+taskAttrs(t)+'></button>';}).join('')+'</div>')+'</section>';}).join('')+'</div>';}
function matrix(){const halves=[ordered.slice(0,23),ordered.slice(23)];return '<div class="wo-matrixgrid">'+halves.map(function(half){return '<table class="wo-matrix" aria-label="Task group coverage"><thead><tr><th class="wo-mtask">Task</th>'+groups.map(function(g){return '<th>'+g.short+'</th>';}).join('')+'<th class="wo-mselect">Work group</th></tr></thead><tbody>'+half.map(function(t){return '<tr class="wo-matrixtr '+(selected(t.key)?'selected':'')+'" data-task="'+t.key+'"><td class="wo-mtask"><button type="button" data-select-key="'+t.key+'" data-tooltip="'+esc(t.title)+'">'+esc(name(t))+'</button></td>'+groups.map(function(g){return '<td style="--gc:'+color(g.id)+'"><button type="button" class="wo-radio '+(groupOf(t.key)===g.id?'on':'')+'" aria-label="Assign '+esc(t.short)+' to '+g.name+'" aria-pressed="'+(groupOf(t.key)===g.id)+'" data-matrix-task="'+t.key+'" data-to-group="'+g.id+'"></button></td>';}).join('')+'<td class="wo-mselect"><select aria-label="Work group for '+esc(t.short)+'" data-assign-task="'+t.key+'">'+groupOptions(groupOf(t.key))+'</select></td></tr>';}).join('')+'</tbody></table>';}).join('')+'</div>';}
function bundles(){return '<div class="wo-bundles">'+data.bundles.map(function(b){const owners=Array.from(new Set(b.tasks.map(groupOf)));return '<section class="wo-bundle"><header class="wo-bundlehead"><h3>'+b.name+'</h3><span class="wo-count">'+b.tasks.length+'</span></header><div class="wo-bundletasks">'+b.tasks.map(function(key){return station(byKey[key],'wo-tile');}).join('')+'</div><label>Assign this task pack<select class="wo-select" data-bundle="'+b.id+'">'+(owners.length>1?'<option value="" selected>Mixed groups</option>':'')+groupOptions(owners.length===1?owners[0]:null)+'</select></label></section>';}).join('')+'</div>';}
function paint(){return '<div class="wo-paintgrid" aria-label="Paint ownership across all 46 tasks">'+ordered.map(function(t){return station(t,'wo-paint');}).join('')+'</div>';}
function drawLines(){root.querySelectorAll('.wo-map').forEach(function(w){if(!w.offsetWidth)return;const svg=w.querySelector('svg'),rect=w.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+w.clientWidth+' '+w.clientHeight);svg.style.display=design.showLines?'':'none';let out='';tasks.forEach(function(t){const target=w.querySelector('[data-task="'+t.key+'"] .wo-stop');if(!target)return;const tr=target.getBoundingClientRect(),tx=tr.left+tr.width/2-rect.left,ty=tr.top+tr.height/2-rect.top;t.dependsOn.forEach(function(k){const start=w.querySelector('[data-task="'+k+'"] .wo-stop');if(!start)return;const sr=start.getBoundingClientRect(),sx=sr.left+sr.width/2-rect.left,sy=sr.top+sr.height/2-rect.top;const focus=groupOf(t.key)===state.focus&&groupOf(k)===state.focus;let path;if(Math.abs(ty-sy)<15){path='M '+sx+' '+sy+' C '+sx+' '+(sy-24)+', '+tx+' '+(ty-24)+', '+tx+' '+ty;}else{const bend=(sy+ty)/2;path='M '+sx+' '+sy+' C '+sx+' '+bend+', '+tx+' '+bend+', '+tx+' '+ty;}out+='<path d="'+path+'" class="'+(focus?'focused':'')+'" />';});});svg.innerHTML=out;w.style.setProperty('--wo-route-color',color(state.focus));});}
function render(){root.querySelectorAll('[data-view]').forEach(function(el){const v=el.dataset.view,visual=v==='metro'?metro():v==='lanes'?lanes():v==='stages'?stages():v==='matrix'?matrix():v==='bundles'?bundles():paint();el.innerHTML=header()+'<main class="wo-main">'+intro()+chips(v)+visual+inspector()+footer()+'</main>';el.style.colorScheme=design.theme==='Light'?'light':design.theme==='Dark'?'dark':'';});requestAnimationFrame(drawLines);}
function assign(keys,to){if(!group(to))return;state.undo=Object.assign({},state.assignment);keys.forEach(function(k){state.assignment[k]=to;});state.selected=keys[0];state.message=keys.length===1?byKey[keys[0]].short+' → '+group(to).name:keys.length+' tasks → '+group(to).name;render();save();}
root.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.focusGroup){state.focus=b.dataset.focusGroup;state.message='';render();save();return;}if(b.dataset.toggleStage){const p=b.dataset.toggleStage;state.openStages=state.openStages.includes(p)?state.openStages.filter(function(x){return x!==p;}):state.openStages.concat(p);render();save();return;}if(b.dataset.matrixTask){assign([b.dataset.matrixTask],b.dataset.toGroup);return;}if(b.dataset.action==='undo'){state.assignment=state.undo||{};state.undo=null;state.message='Grouping change undone.';render();save();return;}if(b.dataset.action==='save'){state.message='All '+tasks.length+' tasks grouped. Saved for onboarding review.';render();save();return;}const key=b.dataset.task||b.dataset.selectKey;if(key&&byKey[key]){if(b.classList.contains('wo-paint')){if(suppressPaintClick)return;assign([key],state.focus);}else{state.selected=key;state.message='';render();save();}}});
root.addEventListener('change',function(e){const el=e.target;if(el.matches('[data-assign-selected]'))assign([state.selected],el.value);else if(el.dataset.assignTask)assign([el.dataset.assignTask],el.value);else if(el.dataset.bundle&&el.value){const b=data.bundles.find(function(x){return x.id===el.dataset.bundle;});assign(b.tasks,el.value);}});
let painting=false,painted=new Set(),suppressPaintClick=false;
function livePaint(key){if(!byKey[key]||painted.has(key))return;painted.add(key);state.assignment[key]=state.focus;state.selected=key;root.querySelectorAll('.wo-paint[data-task="'+key+'"]').forEach(function(el){el.style.setProperty('--gc',color(state.focus));});root.querySelectorAll('[data-group-count]').forEach(function(el){el.textContent=count(el.dataset.groupCount);});}
root.addEventListener('pointerdown',function(e){const b=e.target.closest('.wo-paint');if(!b||e.button!==0)return;painting=true;painted=new Set();state.undo=Object.assign({},state.assignment);suppressPaintClick=true;livePaint(b.dataset.task);b.focus();e.preventDefault();});
root.addEventListener('pointermove',function(e){if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest('.wo-paint');if(b&&root.contains(b))livePaint(b.dataset.task);});
window.addEventListener('pointerup',function(){if(!painting)return;painting=false;state.message=painted.size+' task'+(painted.size===1?'':'s')+' → '+group(state.focus).name;render();save();setTimeout(function(){suppressPaintClick=false;},0);});
window.addEventListener('pointercancel',function(){painting=false;suppressPaintClick=false;render();});
window.addEventListener('openai:set_globals',function(e){hydrate(e.detail&&e.detail.globals&&e.detail.globals.widgetState);render();});
render();new ResizeObserver(drawLines).observe(root);new MutationObserver(function(){requestAnimationFrame(drawLines);}).observe(root,{subtree:true,attributes:true,attributeFilter:['hidden']});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:function(){render();save();}});tweak.addSelect(design,'theme',{label:'界面外观',options:[{label:'跟随系统',value:'Follow device'},{label:'浅色',value:'Light'},{label:'深色',value:'Dark'}]});tweak.addToggle(design,'shortLabels',{label:'任务使用两个英文词'});const metroTweak=new Tweak({container:root.querySelector('[data-view="metro"]'),onChange:function(){drawLines();save();}});metroTweak.addToggle(design,'showLines',{label:'显示原有依赖连线'});}
})();
</script>
