function routePath(a,b){const x1=a.x+280,y1=a.y+115,x2=b.x,y2=b.y+115,gap=Math.max(3,(x2-x1)/3),exit=x1+Math.min(22,gap),entry=x2-Math.min(22,gap);const obstacles=st.packs.filter(p=>p.id!==a.id&&p.id!==b.id);const blocked=points=>points.slice(1).some((p,i)=>{const q=points[i];return obstacles.some(o=>{const left=o.x-4,right=o.x+284,top=o.y-4,bottom=o.y+234;return p[0]===q[0]?p[0]>left&&p[0]<right&&Math.max(p[1],q[1])>top&&Math.min(p[1],q[1])<bottom:p[1]>top&&p[1]<bottom&&Math.max(p[0],q[0])>left&&Math.min(p[0],q[0])<right})});const lanes=[y1,y2,...st.packs.flatMap(p=>[p.y-16,p.y+246])].sort((u,v)=>(Math.abs(y1-u)+Math.abs(y2-u))-(Math.abs(y1-v)+Math.abs(y2-v)));let points;for(const lane of lanes){const candidate=[[x1,y1],[exit,y1],[exit,lane],[entry,lane],[entry,y2],[x2,y2]];if(!blocked(candidate)){points=candidate;break}}points=points||[[x1,y1],[exit,y1],[exit,-24],[entry,-24],[entry,y2],[x2,y2]];return points.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')}

root.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){const r=role(el.dataset.roleId);if(!r)return;if(!el.dataset.editStarted){checkpoint();el.dataset.editStarted='yes'}if(el.dataset.field==='title')r.title=el.value;else person(r.personId)[el.dataset.field]=el.value;save()}if(el.dataset.teamName){if(!el.dataset.editStarted){checkpoint();el.dataset.editStarted='yes'}team(el.dataset.teamName).name=el.value;save()}});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.moveRole)moveRole(el.dataset.moveRole,el.value);else if(el.dataset.teamLead){checkpoint();team(el.dataset.teamLead).leadRoleId=el.value||null;done('Team lead updated.')}else if(el.matches('[data-pack-team]')){checkpoint();pack(st.selectedPack).teamId=el.value||null;done('All tasks in this pack now belong to '+(team(el.value)?.name||'an unassigned team')+'.')}else if(el.matches('[data-select-pack]'))focusPack(el.value);else if(el.dataset.field||el.dataset.teamName){render();save();note('Draft updated.')}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pf-people-tab'){showTab('people');return}if(b.id==='pf-work-tab'){showTab('work');return}if(b.dataset.addRoleTeam){openEditor('role',b.dataset.addRoleTeam);return}if(b.dataset.showTeam){st.filter=b.dataset.showTeam;showTab('work');return}if(b.dataset.filter!==undefined){st.filter=b.dataset.filter||null;renderWork();save();return}if(b.dataset.openPack){st.selectedPack=b.dataset.openPack;st.selectedTask=null;renderNodes();renderInspector();save();return}if(b.dataset.nodeTask){st.selectedPack=b.dataset.ownerPack;st.selectedTask=b.dataset.nodeTask;renderNodes();renderInspector();save();return}if(b.dataset.task){st.selectedTask=b.dataset.task;renderInspector();save();return}if(b.dataset.portOut){connectFrom=b.dataset.portOut;renderNodes();note('Connect '+pack(connectFrom).title+' to an input ○, or use Connections & sequence.');return}if(b.dataset.portIn){if(connectFrom)connect(connectFrom,b.dataset.portIn);else note('Choose an output › first.');return}if(b.dataset.removeEdge){checkpoint();const [a,t]=b.dataset.removeEdge.split('|');st.edges=st.edges.filter(x=>!(x.from===a&&x.to===t));done('Suggested connection removed. Original task dependencies are preserved.');return}switch(b.dataset.action){case 'add-team':openEditor('team');break;case 'add-role':openEditor('role');break;case 'add-pack':openEditor('pack',st.filter);break;case 'cancel-editor':editor=null;$('#pf-editor-host').innerHTML='';break;case 'save':{const stored=save();render();note(stored===true?'Draft saved in this preview. No website changes or invitations.':stored===false?'Changes remain in this open preview; storage could not be updated.':'Draft remains in this open page. Session saving is unavailable here.',stored===false);break;}case 'undo':if(history.length){st=history.pop();done('Last change undone.')}break;case 'fit':fit();save();break;case 'zoom-in':zoom(1.25);break;case 'zoom-out':zoom(.8);break;case 'readable':focusPack(st.selectedPack);break;case 'arrange':checkpoint();arrange();done('Task packs arranged from left to right.');break;case 'go-people':showTab('people');break;}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='pf-connect-form'){const f=new FormData(e.target);connect(f.get('from'),f.get('to'));return}if(e.target.id!=='pf-editor-form'||!editor)return;const f=new FormData(e.target);checkpoint();const id='new-'+Date.now().toString(36)+'-'+counter++;const type=editor.type;if(type==='team'){st.teams.push({id,name:f.get('teamName').trim()||'New team',leadRoleId:null,color:'teal',kind:'team'})}else if(type==='role'){const pid='person-'+id;st.people.push({id:pid,name:f.get('personName').trim(),email:f.get('personEmail').trim()});st.roles.push({id,title:f.get('roleTitle').trim(),personId:pid,teamId:f.get('teamId')||null,reportsToRoleId:f.get('reportsTo')||null})}else{st.packs.push({id,title:f.get('packName').trim(),taskIds:[],teamId:f.get('teamId')||null,x:Math.max(...st.packs.map(p=>p.x))+350,y:290});st.selectedPack=id;st.camera=null}editor=null;done(type==='team'?'Empty team created. Add roles or drag them in.':type==='role'?'Role created. Your team structure is unchanged.':'Empty task pack created. Connect it to the workflow.')});
root.addEventListener('pointerdown',e=>{if(e.button!==0)return;const rh=e.target.closest('[data-drag-role]');const ph=e.target.closest('[data-drag-pack]');const s=e.target.closest('.pf-stage');if(rh){e.preventDefault();const source=rh.closest('.pf-role');drag={kind:'role',id:rh.dataset.dragRole,startX:e.clientX,startY:e.clientY,source,moved:false};return}if(ph){e.preventDefault();const p=pack(ph.dataset.dragPack);drag={kind:'pack',id:p.id,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y,moved:false};return}if(s&&!e.target.closest('button,.pf-node')){e.preventDefault();drag={kind:'pan',startX:e.clientX,startY:e.clientY,camera:clone(camera()),moved:false}}});
function pointerMove(e){if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.hypot(dx,dy)<4&&!drag.moved)return;if(!drag.moved){drag.moved=true;if(drag.kind==='role'){drag.ghost=drag.source.cloneNode(true);drag.ghost.classList.add('pf-ghost');drag.ghost.setAttribute('aria-hidden','true');drag.ghost.querySelectorAll('input,select,button').forEach(x=>x.tabIndex=-1);root.appendChild(drag.ghost);drag.source.classList.add('pf-drag-source')}else if(drag.kind==='pack')checkpoint()}if(drag.kind==='role'){drag.ghost.style.left=e.clientX+14+'px';drag.ghost.style.top=e.clientY+14+'px';$$('.pf-over').forEach(x=>x.classList.remove('pf-over'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-team]');if(target&&root.contains(target))target.classList.add('pf-over')}else if(drag.kind==='pan'){st.camera={...drag.camera,x:drag.camera.x+dx,y:drag.camera.y+dy};applyCamera()}else{const p=pack(drag.id),z=camera().z;const minX=Math.max(0,...st.edges.filter(x=>x.to===p.id).map(x=>pack(x.from).x+320)),maxX=Math.min(5000,...st.edges.filter(x=>x.from===p.id).map(x=>pack(x.to).x-320));p.x=Math.max(minX,Math.min(maxX,Math.round((drag.x+dx/z)/16)*16));p.y=Math.max(20,Math.min(1800,Math.round((drag.y+dy/z)/16)*16));const node=$(`[data-pack="${p.id}"]`);node.style.left=p.x+'px';node.style.top=p.y+'px';drawPaths()}}
function pointerUp(e){if(!drag)return;const d=drag;drag=null;if(d.kind==='role'){d.ghost?.remove();d.source?.classList.remove('pf-drag-source');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-team]');$$('.pf-over').forEach(x=>x.classList.remove('pf-over'));if(d.moved&&target&&root.contains(target))moveRole(d.id,target.dataset.dropTeam);else if(!d.moved)note('Drag into a team, or use the Team dropdown on this card.')}else if(d.kind==='pack'&&d.moved){const p=pack(d.id);while(st.packs.some(x=>x.id!==p.id&&Math.abs(x.x-p.x)<280&&Math.abs(x.y-p.y)<230))p.y+=256;renderNodes();save();$$('[data-action=undo]').forEach(x=>x.disabled=false);note('Task pack moved. Dependencies are unchanged.')}else if(d.moved)save()}
window.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerUp);window.addEventListener('pointercancel',()=>{if(drag?.ghost)drag.ghost.remove();drag?.source?.classList.remove('pf-drag-source');drag=null;$$('.pf-over').forEach(x=>x.classList.remove('pf-over'))});
root.addEventListener('wheel',e=>{if(e.target.closest('.pf-stage')&&(e.ctrlKey||e.metaKey)){e.preventDefault();zoom(e.deltaY<0?1.08:.93)}},{passive:false});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){connectFrom=null;editor=null;$('#pf-editor-host').innerHTML='';renderNodes();note('Connection cancelled.')}if(e.target.matches('.pf-tab')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();showTab(st.tab==='work'?'people':'work');$(st.tab==='work'?'#pf-work-tab':'#pf-people-tab').focus()}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){incoming(e.detail.globals.widgetState);render()}});
let lastWidth=0;new ResizeObserver(()=>{const width=root.clientWidth;if(width!==lastWidth){const previousWidth=lastWidth;lastWidth=width;if(st.tab==='work'&&previousWidth&&Math.abs(width-previousWidth)>80){const f=$('[data-action=fit]');if(f)f.textContent=width<600?'Center pack':'Overview';fit()}}}).observe(root);
render();
})();
</script>
</div>
