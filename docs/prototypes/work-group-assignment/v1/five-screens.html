s-assignment-review .pg-groupnav{padding:6px 7px;font-size:11px}#platypus-assignment-review .pg-account{gap:5px}#platypus-assignment-review .pg-account b{font-size:11px}#platypus-assignment-review .pg-brand{font-size:21px}}

</style>
<script>
(function () {
  const root = document.getElementById('platypus-assignment-review');
  const persons = {
    alex:{name:'Alex Rivera',role:'President'}, maya:{name:'Maya Chen',role:'Treasurer'}, jordan:{name:'Jordan Patel',role:'Events lead'},
    sam:{name:'Sam Okafor',role:'Marketing lead'}, priya:{name:'Priya Nair',role:'Secretary'}, chris:{name:'Chris Lee',role:'Finance team'},
    riley:{name:'Riley Brooks',role:'Designer'}, taylor:{name:'Taylor Kim',role:'Operations'}
  };
  const groupData = {
    coordination:{name:'Event coordination',short:'Coordination',lead:'jordan',members:['jordan','priya','taylor'],tasks:[
      {id:'room',title:'Reserve campus room',due:'Feb 19',status:'Not started'},
      {id:'schedule',title:'Confirm the run of show',due:'Feb 26',status:'Not started'},
      {id:'setup',title:'Prepare room setup',due:'Mar 4',status:'Not started'}]},
    finance:{name:'Finance',short:'Finance',lead:'maya',members:['maya','chris'],tasks:[
      {id:'budget',title:'Prepare event budget',due:'Feb 12',status:'Working on it'},
      {id:'funding',title:'Submit funding request',due:'Feb 16',status:'Not started'},
      {id:'purchase',title:'Submit purchase request',due:'Feb 19',status:'Not started'}]},
    marketing:{name:'Marketing',short:'Marketing',lead:'sam',members:['sam','riley','alex'],tasks:[
      {id:'poster',title:'Design the event poster',due:'Feb 19',status:'Working on it'},
      {id:'promote',title:'Publish event announcement',due:'Feb 22',status:'Not started'},
      {id:'rsvp',title:'Collect RSVPs',due:'Mar 3',status:'Not started'}]}
  };
  const order=['coordination','finance','marketing'];
  const design={theme:'Follow device',layout:'Group cards',spacing:16,showDue:true};
  const initialGroups=order.map(function(id){return {id:id,name:groupData[id].name,tasks:groupData[id].tasks.map(function(t){return t.id;})};});
  const taskIndex=Object.fromEntries(order.flatMap(function(g){return groupData[g].tasks.map(function(t){return [t.id,t];});}));
  let state={
    onboarding:{tab:'groups',step:'groups',groups:initialGroups,menu:null,message:''},
    create:{leads:{coordination:'jordan',finance:'maya',marketing:'sam'},members:{coordination:['priya','taylor'],finance:['chris'],marketing:['riley','alex']},menu:null,peek:null,created:false,message:''},
    workspaces:{
      finance:{owners:{budget:'maya',funding:'maya',purchase:'maya'},selected:['funding','purchase'],panel:'bulk',target:'chris',menu:null,message:''},
      marketing:{owners:{poster:'sam',promote:'sam',rsvp:'sam'},selected:[],panel:null,target:'riley',menu:'promote',message:''},
      coordination:{owners:{room:'jordan',schedule:'jordan',setup:'jordan'},selected:[],panel:'room',target:'priya',menu:null,message:''}
    }
  };
  function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function initials(id){return persons[id].name.split(' ').map(function(w){return w[0];}).join('');}
  function first(id){return persons[id].name.split(' ')[0];}
  function av(id,lead){return '<span class="pg-avatar'+(lead?' pg-lead':'')+'" aria-hidden="true">'+initials(id)+'</span>';}
  function button(text,action,extra){return '<button type="button" class="pg-btn '+(extra||'')+'" data-action="'+action+'">'+text+'</button>';}
  function flash(text){return '<div class="pg-flash" role="status" aria-live="polite">'+(text?'✓ <span>'+esc(text)+'</span>':'')+'</div>';}
  function persist(){
    if(window.openai && window.openai.setWidgetState){
      const assignments={}; order.forEach(function(g){assignments[g]={lead:persons[groupData[g].lead].name,owners:state.workspaces[g].owners};});
      window.openai.setWidgetState({modelContent:{review:'Work-group assignment designs',event:'Welcome Mixer',eventLeads:state.create.leads,taskAssignments:assignments},privateContent:{prototype:state,design:design}}).catch(function(){});
    }
  }
  function hydrate(saved){
    const p=saved && saved.privateContent;
    if(!p || !p.prototype || !p.prototype.onboarding || !p.prototype.create || !p.prototype.workspaces) return;
    const candidate=p.prototype;
    if(!Array.isArray(candidate.onboarding.groups) || !order.every(function(g){return candidate.workspaces[g] && candidate.workspaces[g].owners && candidate.create.leads[g] && persons[candidate.create.leads[g]];}))return;
    state=candidate; if(p.design)Object.assign(design,p.design);
    if(state.create.created)commitEventTeams(true);
  }
  hydrate(window.openai && window.openai.widgetState);
  window.addEventListener('openai:set_globals',function(e){hydrate(e.detail && e.detail.globals && e.detail.globals.widgetState);renderAll();});
  function brand(compact){return '<div class="pg-brand"><span class="pg-brandmark" aria-hidden="true"></span>Platypus'+(compact?'':'<span class="pg-org">Desert Founders Society</span>')+'</div>';}
  function topbar(viewer){return '<header class="pg-top">'+brand(false)+'<div class="pg-account"><span>View as</span><b>'+esc(persons[viewer].name)+'</b>'+av(viewer,true)+'</div></header>';}
  function appNav(){return '<nav class="pg-nav" aria-label="Main navigation"><div class="pg-navword">Your workspace</div>'+['Reminders','Plan','Handoff','Rules'].map(function(n){return '<button class="pg-navbutton" type="button" '+(n==='Plan'?'aria-current="page"':'')+' data-action="nav-preview" data-name="'+n+'"><span class="pg-dot" aria-hidden="true"></span>'+n+'</button>';}).join('')+'<div class="pg-navfoot"><button class="pg-navbutton" type="button" data-action="nav-preview" data-name="Team">Team</button><button class="pg-navbutton" type="button" data-action="nav-preview" data-name="Settings">Settings</button><div class="pg-small" style="padding:14px 12px 0">Fictional demo</div></div></nav>';}
  function eventNav(){return '<nav class="pg-eventsnav" aria-label="Events"><strong>Events</strong>'+['Welcome Mixer','Founder Dinner','Speaker Night'].map(function(n){return '<button type="button" class="pg-eventnavbutton" '+(n==='Welcome Mixer'?'aria-current="page"':'')+' data-action="event-preview" data-name="'+n+'">'+n+'</button>';}).join('')+'</nav>';}
  function progress(index){const labels=['Name','Constitution','Goals','Team','First event','Reminders','Confirm','Invite'];return '<ol class="pg-progress" aria-label="Setup progress">'+labels.map(function(l,i){return '<li class="'+(i<index?'pg-past':i===index?'pg-now':'')+'" '+(i===index?'aria-current="step"':'')+'><i aria-hidden="true"></i><span>'+l+'</span></li>';}).join('')+'</ol>';}
  function obHeader(index){return '<header class="pg-obhead">'+brand(true)+progress(index)+button('Exit','ob-exit')+'</header>';}
  function moveMenu(task){return '<div class="pg-pop" role="menu" aria-label="Move task"><div class="pg-poplabel">Move to group</div>'+state.onboarding.groups.map(function(g){return '<button type="button" class="pg-popoption" role="menuitem" data-action="move-task" data-task="'+task+'" data-group="'+g.id+'">'+esc(g.name)+'</button>';}).join('')+'</div>';}
  function groupCards(){return '<div class="pg-groupgrid '+(design.layout==='Compact rows'?'pg-compact':'')+'">'+state.onboarding.groups.map(function(g,i){return '<article class="pg-groupcard"><div><div class="pg-groupcap"><span class="pg-taskmark" aria-hidden="true"></span>Work group '+(i+1)+'</div><input class="pg-groupname" aria-label="Name of group '+(i+1)+'" data-group-name="'+g.id+'" value="'+esc(g.name)+'" maxlength="40"><div class="pg-small">'+g.tasks.length+' tasks</div></div><ul class="pg-grouplist">'+g.tasks.map(function(t){return '<li class="pg-grouptask"><span>'+esc(taskIndex[t].title)+'</span><button type="button" class="pg-icon" aria-label="Move '+esc(taskIndex[t].title)+'" data-action="ob-task-menu" data-task="'+t+'">⋯</button>'+(state.onboarding.menu===t?moveMenu(t):'')+'</li>';}).join('')+(g.tasks.length?'':'<li class="pg-grouptask"><span class="pg-small">Move a task here.</span></li>')+'</ul></article>';}).join('')+'</div>';}
  function peopleTab(){return '<div>'+[['President','Alex Rivera'],['Treasurer','Maya Chen'],['Events lead','Jordan Patel'],['Marketing lead','Sam Okafor'],['Secretary','Priya Nair'],['Finance associate','Chris Lee'],['Marketing associate','Riley Brooks'],['Operations coordinator','Taylor Kim']].map(function(p){return '<div class="pg-peoplegrid"><label><span class="pg-label">Role</span><input class="pg-input" value="'+p[0]+'"></label><label><span class="pg-label">Person</span><input class="pg-input" value="'+p[1]+'"></label></div>';}).join('')+'</div>';}
  function renderOnboarding(){
    const mount=root.querySelector('[data-screen="onboarding"]');const ob=state.onboarding;
    if(ob.step==='event'){
      mount.innerHTML=obHeader(4)+'<main class="pg-obmain"><div class="pg-stepmeta">Step 5 of 8 · First event</div><div class="pg-obintro"><h1>Who\'s leading your first event?</h1><p class="pg-sub">Welcome Mixer · Mar 5, 2027 · 40 people</p></div>'+assignmentRows('onboarding')+'<div class="pg-obfooter">'+button('Back','ob-back')+button('Continue','ob-done','pg-main')+'</div>'+flash(ob.message)+'</main>';
    }else{
      mount.innerHTML=obHeader(3)+'<main class="pg-obmain"><div class="pg-stepmeta">Step 4 of 8 · Team</div><div class="pg-obintro"><h1>How will your team split the work?</h1><p class="pg-sub">Group related tasks once. Choose people for each event.</p></div><div class="pg-tabs" role="tablist" aria-label="Team setup"><button type="button" class="pg-tab" role="tab" aria-selected="'+(ob.tab==='people')+'" aria-controls="pg-ob-tabpanel" data-action="ob-tab" data-tab="people">People <span class="pg-count">8</span></button><button type="button" class="pg-tab" role="tab" aria-selected="'+(ob.tab==='groups')+'" aria-controls="pg-ob-tabpanel" data-action="ob-tab" data-tab="groups">Work groups <span class="pg-count">'+ob.groups.length+'</span></button></div><div id="pg-ob-tabpanel" role="tabpanel">'+(ob.tab==='groups'?'<div class="pg-between"><div><b>General meeting workflow</b><div class="pg-small">'+Object.keys(taskIndex).length+' tasks · names are editable</div></div>'+button('+ Add a group','ob-add','pg-quiet')+'</div>'+groupCards():peopleTab())+'</div><div class="pg-obfooter">'+button('Back','ob-back')+'<div class="pg-line"><span class="pg-small">Adjust groups later in Settings.</span>'+button('Continue','ob-next','pg-main')+'</div></div>'+flash(ob.message)+'</main>';
    }
  }
  function activeGroups(){return state.onboarding.groups.filter(function(g){return g.tasks.length>0;});}
  function syncDraftGroups(){
    state.onboarding.groups.forEach(function(g){
      if(!(g.id in state.create.leads))state.create.leads[g.id]=null;
      if(!(g.id in state.create.members))state.create.members[g.id]=[];
    });
  }
  function commitEventTeams(keepOwners){
    activeGroups().forEach(function(g){
      if(!groupData[g.id])return;
      const meta=groupData[g.id],ws=state.workspaces[g.id];
      meta.name=g.name;meta.short=g.name==='Event coordination'?'Coordination':g.name;meta.lead=state.create.leads[g.id];
      meta.members=Array.from(new Set([meta.lead].concat(state.create.members[g.id])));
      meta.tasks=g.tasks.map(function(t){return taskIndex[t];});
      if(!keepOwners){
        ws.owners=Object.fromEntries(g.tasks.map(function(t){return [t,meta.lead];}));
        ws.selected=[];ws.panel=null;ws.menu=null;ws.message='';ws.undo=null;
        ws.target=meta.members.find(function(p){return p!==meta.lead;})||meta.lead;
      }
    });
  }
  function workspaceFlash(group){
    const ws=state.workspaces[group];
    return '<div class="pg-flash" role="status" aria-live="polite">'+(ws.message?'<span>'+esc(ws.message)+'</span>':'')+(ws.undo?'<button type="button" class="pg-btn pg-quiet" data-action="undo-assignment" data-group="'+group+'">Undo</button>':'')+'</div>';
  }
  function personMenu(group,kind,source){
    const c=state.create;
    return '<div class="pg-pop" role="listbox" aria-label="'+(kind==='lead'?'Choose group lead':'Choose collaborators')+'"><div class="pg-poplabel">'+(kind==='lead'?'Group lead':'Collaborators')+'</div>'+Object.keys(persons).filter(function(id){return kind==='lead'||id!==c.leads[group];}).map(function(id){return '<button type="button" class="pg-popoption" role="option" aria-selected="'+(kind==='lead'?c.leads[group]===id:c.members[group].includes(id))+'" data-action="'+(kind==='lead'?'choose-lead':'choose-member')+'" data-group="'+group+'" data-person="'+id+'" data-source="'+source+'">'+av(id,id===c.leads[group])+'<span>'+esc(persons[id].name)+'<small>'+esc(persons[id].role)+'</small></span>'+(kind==='members'&&c.members[group].includes(id)?'<span aria-hidden="true">✓</span>':'')+'</button>';}).join('')+'</div>';
  }
  function assignmentRows(source){
    syncDraftGroups();const c=state.create;
    return '<div class="pg-assignment"><div class="pg-assignmenthead"><span>Work group</span><span>Group lead</span><span>Collaborators</span></div>'+activeGroups().map(function(g){
      const id=g.id,lead=c.leads[id];
      return '<section class="pg-assignmentrow"><div class="pg-assignmentname"><h3>'+esc(g.name)+'</h3><button type="button" class="pg-taskpeek" aria-expanded="'+(c.peek===id)+'" data-action="peek-tasks" data-group="'+id+'" data-source="'+source+'">'+g.tasks.length+' tasks</button></div><div class="pg-personchoice"><span class="pg-labelmobile">Group lead</span><button type="button" class="pg-rolechoice" aria-label="Choose '+esc(g.name)+' lead" aria-expanded="'+(c.menu===source+':'+id+':lead')+'" data-action="event-menu" data-group="'+id+'" data-kind="lead" data-source="'+source+'"><span class="pg-line">'+(lead?av(lead,true)+'<span>'+first(lead)+'</span>':'<span class="pg-sub">Choose a lead</span>')+'</span><span aria-hidden="true">⌄</span></button>'+(c.menu===source+':'+id+':lead'?personMenu(id,'lead',source):'')+'</div><div class="pg-personchoice"><span class="pg-labelmobile">Collaborators</span><div class="pg-collabs">'+c.members[id].filter(function(p){return p!==lead;}).map(function(p){return '<span class="pg-collabchip">'+first(p)+'</span>';}).join('')+'<button type="button" class="pg-addmember" aria-label="Choose '+esc(g.name)+' collaborators" aria-expanded="'+(c.menu===source+':'+id+':members')+'" data-action="event-menu" data-group="'+id+'" data-kind="members" data-source="'+source+'">+</button></div>'+(c.menu===source+':'+id+':members'?personMenu(id,'members',source):'')+'</div>'+(c.peek===id?'<ul class="pg-eventtasks">'+g.tasks.map(function(t){return '<li>'+esc(taskIndex[t].title)+'</li>';}).join('')+'</ul>':'')+'</section>';
    }).join('')+'</div>';
  }
  function renderCreate(){const c=state.create;const mount=root.querySelector('[data-screen="create"]');
    let main;
    if(c.created){main='<div class="pg-stepmeta">Event created</div><div class="pg-pageintro"><h1>Welcome Mixer is ready.</h1><p class="pg-sub">9 tasks assigned across '+activeGroups().length+' work groups.</p></div><div class="pg-summarylist">'+activeGroups().map(function(entry){const g=entry.id,lead=c.leads[g];return '<section class="pg-summaryrow"><div><h3>'+esc(entry.name)+'</h3><p class="pg-small">'+entry.tasks.length+' tasks · '+c.members[g].filter(function(p){return p!==lead;}).map(first).join(', ')+' collaborating</p></div><div class="pg-line">'+av(lead,true)+'<b>'+persons[lead].name+'</b><span class="pg-pill pg-active">Group lead</span></div></section>';}).join('')+'</div><div class="pg-formfooter">'+button('Edit team assignments','edit-event')+'<span class="pg-small">Task reminders follow the task owner.</span></div>'+flash(c.message);
    }else{main='<div class="pg-breadcrumb"><span>Plan</span><span>›</span><span>Create event</span></div><div class="pg-between"><h1>Create an event</h1><span class="pg-pill">2 of 2</span></div><div class="pg-stepswitch"><span>✓ Event details</span><span aria-hidden="true">→</span><span class="pg-current">Teams &amp; owners</span></div><div class="pg-eventmeta"><div><h3>Welcome Mixer</h3><p class="pg-small">Mar 5, 2027 · 40 people · On campus</p></div>'+button('Edit details','event-details','pg-quiet')+'</div><div class="pg-pageintro"><h2>Who\'s taking each part?</h2><p class="pg-sub">Choose a lead and collaborators for each group.</p></div>'+assignmentRows('create')+'<div class="pg-note"><span aria-hidden="true">•</span><span>Tasks start with the group lead. Leads can assign them within their team.</span></div><div class="pg-formfooter">'+button('Back','event-details')+'<div class="pg-line"><span class="pg-small">'+activeGroups().length+' groups · 9 tasks</span>'+button('Create event','create-event','pg-main')+'</div></div>'+flash(c.message);}
    mount.innerHTML=topbar('alex')+'<div class="pg-frame">'+appNav()+'<main class="pg-appcontent">'+main+'</main></div>';
  }
  function ownerMenu(group,task){const ws=state.workspaces[group],g=groupData[group];return '<div class="pg-pop pg-ownermenu" role="listbox" aria-label="Task owner"><div class="pg-poplabel">Assign within '+esc(g.name)+'</div>'+g.members.map(function(p){return '<button type="button" class="pg-popoption" role="option" aria-selected="'+(ws.owners[task]===p)+'" data-action="inline-assign" data-group="'+group+'" data-task="'+task+'" data-person="'+p+'">'+av(p,p===g.lead)+'<span>'+persons[p].name+'<small>'+(p===g.lead?'Group lead':persons[p].role)+'</small></span>'+(ws.owners[task]===p?'<span aria-hidden="true">✓</span>':'')+'</button>';}).join('')+'</div>';}
  function taskTable(group){const ws=state.workspaces[group],g=groupData[group];return '<div class="pg-tasktable" role="table" aria-label="'+esc(g.name)+' tasks"><div class="pg-tr pg-thead" role="row"><span></span><span role="columnheader">Task</span><span role="columnheader">Owner</span>'+(design.showDue?'<span class="pg-due" role="columnheader">Due</span>':'<span></span>')+'</div>'+g.tasks.map(function(t){const owner=ws.owners[t.id],selected=ws.selected.includes(t.id);return '<div class="pg-tr '+(selected?'pg-selected':'')+'" role="row" data-task-row="'+t.id+'"><input type="checkbox" class="pg-check" aria-label="Select '+esc(t.title)+'" data-select-task="'+t.id+'" data-group="'+group+'" '+(selected?'checked':'')+'><div role="cell"><button class="pg-tasktitle" type="button" data-action="task-details" data-group="'+group+'" data-task="'+t.id+'">'+esc(t.title)+'</button><div class="pg-taskstate"><span class="pg-statusdot" aria-hidden="true"></span>'+t.status+'<span class="pg-inline-due"> · Due '+t.due+'</span></div></div><div role="cell" class="pg-taskowner"><button type="button" class="pg-ownerbutton" data-action="owner-menu" data-group="'+group+'" data-task="'+t.id+'" aria-expanded="'+(ws.menu===t.id)+'" aria-label="Change owner of '+esc(t.title)+'; currently '+persons[owner].name+'"><span>'+first(owner)+'</span><span aria-hidden="true">⌄</span></button>'+(ws.menu===t.id?ownerMenu(group,t.id):'')+'</div>'+(design.showDue?'<span role="cell" class="pg-due">'+t.due+'</span>':'<span></span>')+'</div>';}).join('')+'</div>';}
  function bulkPanel(group){const g=groupData[group],ws=state.workspaces[group];return '<aside class="pg-panel" aria-label="Bulk task assignment"><div class="pg-panelhead"><div><div class="pg-paneloverline">'+esc(g.name)+' team</div><h2>Assign '+ws.selected.length+' tasks</h2></div><button class="pg-icon" type="button" aria-label="Close assignment" data-action="close-panel" data-group="'+group+'">×</button></div><ul class="pg-assigntasks">'+g.tasks.filter(function(t){return ws.selected.includes(t.id);}).map(function(t){return '<li><span aria-hidden="true">✓</span>'+t.title+'</li>';}).join('')+'</ul><span class="pg-label">Task owner</span>'+g.members.map(function(p){return '<label class="pg-radioperson"><input type="radio" name="'+group+'-assignee" value="'+p+'" data-bulk-target="'+group+'" '+(ws.target===p?'checked':'')+'>'+av(p,p===g.lead)+'<span><b>'+persons[p].name+'</b><small>'+(p===g.lead?'Group lead':'Collaborator')+'</small></span></label>';}).join('')+'<div class="pg-panelaction">'+button('Cancel','close-panel','pg-quiet')+'<button class="pg-btn pg-main" type="button" '+(!ws.selected.length?'disabled':'')+' data-action="bulk-assign" data-group="'+group+'">Assign '+ws.selected.length+' tasks</button></div><div class="pg-panelnote"><span aria-hidden="true">•</span><span>'+first(g.lead)+' stays group lead.'+(group==='finance'?' Budget approval stays with Alex.':'')+'</span></div></aside>';}
  function detailsPanel(group,task){const ws=state.workspaces[group],g=groupData[group],t=g.tasks.find(function(x){return x.id===task;});if(!t)return '';
    return '<aside class="pg-panel" aria-label="Task details"><div class="pg-panelhead"><div><div class="pg-paneloverline">Task details</div><h2>'+t.title+'</h2></div><button class="pg-icon" type="button" aria-label="Close details" data-action="close-panel" data-group="'+group+'">×</button></div><div class="pg-keyvalue"><span>Work group</span><b>'+esc(g.name)+'</b></div><div class="pg-keyvalue"><span>Group lead</span><b>'+first(g.lead)+'</b></div><div class="pg-keyvalue"><span>Task due</span><b>'+t.due+'</b></div><div class="pg-detailsection"><h3>What needs to happen</h3><p class="pg-small">'+(task==='room'?'Request a campus room for 40 people and attach the confirmation.':task==='poster'?'Prepare a poster with the event date, room and RSVP link.':'Complete this step and add the confirmation to the task.')+'</p></div><div class="pg-detailsection"><label><span class="pg-label">Task owner</span><select class="pg-select" aria-label="Task owner" data-detail-target="'+group+'">'+g.members.map(function(p){return '<option value="'+p+'" '+(ws.target===p?'selected':'')+'>'+persons[p].name+(p===g.lead?' · Group lead':'')+'</option>';}).join('')+'</select></label><p class="pg-small">Members of this event\'s '+esc(g.name)+' team.</p></div><div class="pg-panelaction"><button type="button" class="pg-btn pg-main" data-action="detail-assign" data-group="'+group+'" data-task="'+task+'">Save assignment</button></div><div class="pg-panelnote"><span aria-hidden="true">•</span><span>'+first(g.lead)+' remains responsible for the group.</span></div></aside>';
  }
  function renderWorkspace(group){const mount=root.querySelector('[data-screen="'+group+'"]'),g=groupData[group],ws=state.workspaces[group];const panel=ws.panel==='bulk'?bulkPanel(group):ws.panel?detailsPanel(group,ws.panel):'';
    mount.innerHTML=topbar(g.lead)+'<div class="pg-frame">'+appNav()+'<div class="pg-splitapp">'+eventNav()+'<main class="pg-workspace"><div class="pg-breadcrumb"><span>Events</span><span>›</span><span>Welcome Mixer</span></div><header class="pg-workhead"><div class="pg-eventtitle"><h1>Welcome Mixer</h1><span class="pg-small">Mar 5, 2027</span></div><div class="pg-grouptabs" role="tablist" aria-label="Event work groups">'+order.map(function(id){return '<button type="button" class="pg-groupnav" role="tab" aria-selected="'+(id===group)+'" data-action="group-preview" data-group="'+group+'" data-target-group="'+id+'">'+groupData[id].short+'</button>';}).join('')+'</div></header><div class="pg-between"><h2>'+esc(g.name)+'</h2><span class="pg-pill pg-active">You lead this group</span></div><div class="pg-leadline">'+av(g.lead,true)+'<span><strong>'+persons[g.lead].name+'</strong> · Group lead</span><span aria-hidden="true">·</span><span>Team: '+g.members.map(first).join(', ')+'</span></div><div class="pg-tasklayout '+(!panel?'pg-nopanel':'')+'"><section class="pg-taskarea" aria-label="Group tasks"><div class="pg-tasktools"><span class="'+(ws.selected.length?'pg-selection':'pg-small')+'">'+(ws.selected.length?ws.selected.length+' tasks selected':g.tasks.length+' tasks in this group')+'</span><button type="button" class="pg-btn" data-action="open-bulk" data-group="'+group+'">Assign tasks</button></div>'+taskTable(group)+'<div class="pg-note"><span aria-hidden="true">•</span><span>Click a task owner to change one assignment.</span></div>'+workspaceFlash(group)+'</section>'+panel+'</div></main></div></div>';
  }
  function applyDesign(){root.querySelectorAll('.pg').forEach(function(el){el.style.setProperty('--pg-gap',design.spacing+'px');el.style.colorScheme=design.theme==='Light'?'light':design.theme==='Dark'?'dark':'';});}
  function renderAll(){renderOnboarding();renderCreate();order.forEach(renderWorkspace);applyDesign();}
  function updateAssignmentScreens(){renderOnboarding();renderCreate();applyDesign();}
  function updateWorkspace(group){renderWorkspace(group);applyDesign();}
  root.addEventListener('input',function(e){const field=e.target.closest('[data-group-name]');if(field){const g=state.onboarding.groups.find(function(x){return x.id===field.dataset.groupName;});if(g){g.name=field.value;persist();}}});
  root.addEventListener('change',function(e){const el=e.target;
    if(el.matches('[data-select-task]')){const g=el.dataset.group,ws=state.workspaces[g],task=el.dataset.selectTask;ws.selected=el.checked?Array.from(new Set(ws.selected.concat(task))):ws.selected.filter(function(x){return x!==task;});updateWorkspace(g);persist();}
    if(el.matches('[data-bulk-target]')){state.workspaces[el.dataset.bulkTarget].target=el.value;persist();}
    if(el.matches('[data-detail-target]')){state.workspaces[el.dataset.detailTarget].target=el.value;persist();}
  });
  root.addEventListener('click',function(e){const el=e.target.closest('[data-action]');if(!el||!root.contains(el))return;const a=el.dataset.action,g=el.dataset.group,task=el.dataset.task,person=el.dataset.person,ws=g&&state.workspaces[g];
    if(a==='ob-tab'){state.onboarding.tab=el.dataset.tab;state.onboarding.menu=null;renderOnboarding();}
    else if(a==='ob-task-menu'){state.onboarding.menu=state.onboarding.menu===task?null:task;renderOnboarding();}
    else if(a==='move-task'){state.onboarding.groups.forEach(function(x){x.tasks=x.tasks.filter(function(t){return t!==task;});});state.onboarding.groups.find(function(x){return x.id===g;}).tasks.push(task);state.onboarding.menu=null;state.onboarding.message=taskIndex[task].title+' moved.';renderOnboarding();}
    else if(a==='ob-add'){const id='custom-'+(state.onboarding.groups.length+1);state.onboarding.groups.push({id:id,name:'New group',tasks:[]});renderOnboarding();const field=root.querySelector('[data-group-name="'+id+'"]');if(field){field.focus();field.select();}}
    else if(a==='ob-next'){state.onboarding.step='event';state.onboarding.message='';renderOnboarding();}
    else if(a==='ob-back'){state.onboarding.step='groups';state.onboarding.tab='people';state.onboarding.message='';renderOnboarding();}
    else if(a==='ob-done'){state.onboarding.message='Teams saved for your first event. Next: Reminders.';renderOnboarding();}
    else if(a==='ob-exit'){state.onboarding.message='Your work groups are kept for this setup.';renderOnboarding();}
    else if(a==='event-menu'){const key=el.dataset.source+':'+g+':'+el.dataset.kind;state.create.menu=state.create.menu===key?null:key;updateAssignmentScreens();}
    else if(a==='choose-lead'){const c=state.create,old=c.leads[g];c.leads[g]=person;if(old && old!==person && !c.members[g].includes(old))c.members[g].push(old);c.members[g]=c.members[g].filter(function(p){return p!==person;});c.menu=null;c.message='';updateAssignmentScreens();}
    else if(a==='choose-member'){const members=state.create.members[g];state.create.members[g]=members.includes(person)?members.filter(function(p){return p!==person;}):members.concat(person);updateAssignmentScreens();}
    else if(a==='peek-tasks'){state.create.peek=state.create.peek===g?null:g;updateAssignmentScreens();}
    else if(a==='create-event'){
      const missing=activeGroups().find(function(group){return !state.create.leads[group.id];});
      if(missing){state.create.message='Choose a lead for '+missing.name+'.';renderCreate();}
      else{commitEventTeams();state.create.created=true;state.create.menu=null;state.create.message='9 tasks now have a named owner.';renderAll();}
    }
    else if(a==='edit-event'){state.create.created=false;state.create.message='';renderCreate();}
    else if(a==='event-details'){state.create.message='Welcome Mixer · Mar 5, 2027 · 40 people · On campus.';renderCreate();}
    else if(a==='owner-menu'){ws.menu=ws.menu===task?null:task;updateWorkspace(g);}
    else if(a==='inline-assign'){ws.undo={};ws.undo[task]=ws.owners[task];ws.owners[task]=person;ws.menu=null;ws.message=taskIndex[task].title+' assigned to '+persons[person].name+'.';updateWorkspace(g);}
    else if(a==='open-bulk'){if(!ws.selected.length)ws.selected=groupData[g].tasks.map(function(t){return t.id;});ws.panel='bulk';ws.menu=null;ws.target=groupData[g].members.find(function(p){return p!==groupData[g].lead;})||groupData[g].lead;updateWorkspace(g);}
    else if(a==='close-panel'){const currentGroup=g||el.closest('[data-screen]').dataset.screen;state.workspaces[currentGroup].panel=null;updateWorkspace(currentGroup);}
    else if(a==='bulk-assign'){const count=ws.selected.length;ws.undo={};ws.selected.forEach(function(t){ws.undo[t]=ws.owners[t];});ws.selected.forEach(function(t){ws.owners[t]=ws.target;});ws.selected=[];ws.panel=null;ws.message=count+' tasks assigned to '+persons[ws.target].name+'. '+first(groupData[g].lead)+' stays group lead.';updateWorkspace(g);}
    else if(a==='task-details'){ws.panel=task;ws.target=ws.owners[task];ws.menu=null;updateWorkspace(g);}
    else if(a==='detail-assign'){ws.undo={};ws.undo[task]=ws.owners[task];ws.owners[task]=ws.target;ws.message=taskIndex[task].title+' assigned to '+persons[ws.target].name+'.';updateWorkspace(g);}
    else if(a==='undo-assignment'){if(ws.undo)Object.assign(ws.owners,ws.undo);ws.undo=null;ws.message='Assignment undone.';updateWorkspace(g);}
    else if(a==='group-preview'){ws.message=groupData[el.dataset.targetGroup].name+' is led by '+persons[groupData[el.dataset.targetGroup].lead].name+'.';updateWorkspace(g);}
    else if(a==='nav-preview'||a==='event-preview'){const screen=el.closest('[data-screen]').dataset.screen;const message='Welcome Mixer · Mar 5, 2027 · '+(screen==='create'?'Choose a lead for each group.':screen==='onboarding'?'Set up your work groups.':'Your group assignments are shown here.');if(screen==='create'){state.create.message=message;renderCreate();}else if(state.workspaces[screen]){state.workspaces[screen].message=message;updateWorkspace(screen);}}
    applyDesign();persist();
  });
  document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;state.onboarding.menu=null;state.create.menu=null;order.forEach(function(g){state.workspaces[g].menu=null;});renderAll();});
  if(state.create.created)commitEventTeams(true);
  renderAll();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:function(){renderAll();persist();}});
    tweak.addSelect(design,'theme',{label:'界面外观',options:[{label:'跟随系统',value:'Follow device'},{label:'浅色',value:'Light'},{label:'深色',value:'Dark'}]});
    const setupTweak=new Tweak({container:root.querySelector('[data-screen="onboarding"]'),onChange:function(){renderOnboarding();applyDesign();persist();}});
    setupTweak.addSelect(design,'layout',{label:'分组呈现方式',options:[{label:'分组卡片',value:'Group cards'},{label:'紧凑分行',value:'Compact rows'}]});
    tweak.addSlider(design,'spacing',{label:'任务行留白',min:12,max:23,step:1,unit:'px'});
  }
})();
</script>
