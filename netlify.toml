# Netlify settings for Vera (Option C: static site + Netlify Functions later)
[build]
  publish = "."
  # functions = "netlify/functions"   # turned on when the backend (/api/*) is added

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
