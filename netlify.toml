# Netlify settings for Platypus (Option C: static site + Netlify Functions)
[build]
  publish = "public"              # only this folder is served as the website
  functions = "netlify/functions" # server endpoints (/api/*); never served as files

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
