# Netlify settings for Platypus v1 (Vite app + Netlify Functions)
[build]
  command = "npm run build"
  publish = "dist"                # the built website
  functions = "netlify/functions" # server endpoints (/api/*); never served as files

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
